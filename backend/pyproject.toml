# backend/pyproject.toml
[project]
name = "gcse-coach-api"
version = "0.1.0"
description = "GCSE Coach backend API and worker"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.163,<0.164",
    "uvicorn[standard]>=0.54,<0.55",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.16,<3",
    "sqlalchemy[asyncio]>=2.1,<2.2",
    "asyncpg>=0.32,<0.33",
    "alembic>=1.20,<2",
    "argon2-cffi>=25.1,<26",
    "pyjwt>=2.15,<3",
    "prometheus-client>=0.26,<0.27",
    "pyyaml>=6.0.3,<7",
]

[dependency-groups]
dev = [
    "pytest>=9.2,<10",
    "pytest-asyncio>=1.5,<2",
    "pytest-cov>=7.1,<8",
    "httpx>=0.28,<0.29",
    "testcontainers[postgres]>=4.15,<5",
    "mypy>=2.4,<3",
    "ruff>=0.17,<0.18",
    "types-pyyaml>=6.0.12,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF", "N", "SIM", "PT"]
ignore = []

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S107"]
"alembic/**" = ["N999"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests", "alembic"]

[[tool.mypy.overrides]]
module = ["testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["integration: needs a real PostgreSQL database"]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.coverage.run]
source = ["app"]
branch = true
# SQLAlchemy's async layer runs code inside greenlets; without this, lines
# executed there are reported as missed.
concurrency = ["greenlet", "thread"]
omit = ["app/cli/*"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
