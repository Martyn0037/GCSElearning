# curriculum/specs/ocr-j277.yaml
# OCR GCSE (9–1) Computer Science J277, section 2b content (Components 01
# and 02), copied word for word from the specification PDF (Version 3.1).
#
# - One statement per sub topic (1.1.1, ...): the "Sub topic" column, with its
#   ¨ and o bullets written as "•".
# - The guidance column's "Not required" items are kept as out_of_scope, so
#   generated questions stay inside the spec. "Required" guidance isn't copied.

specification:
  board: ocr
  subject: computer-science
  code: J277
  title: OCR Level 1/Level 2 GCSE (9-1) in Computer Science
  version: Version 3.1
  source_url: "https://www.ocr.org.uk/Images/558027-specification-gcse-computer-science-j277.pdf"
  tiered: false

topics:
  - ref: "1.1"
    title: Systems architecture
    subtopics:
      - title: Architecture of the CPU
        objectives:
          - ref: "1.1.1"
            foundation: >-
              The purpose of the CPU: • The fetch-execute cycle • Common CPU components and their
              function: • ALU (Arithmetic Logic Unit) • CU (Control Unit) • Cache • Registers •
              Von Neumann architecture: • MAR (Memory Address Register) • MDR (Memory Data
              Register) • Program Counter • Accumulator
            out_of_scope: >-
              • Knowledge of passing of data between registers in each stage
      - title: CPU performance
        objectives:
          - ref: "1.1.2"
            foundation: >-
              How common characteristics of CPUs affect their performance: • Clock speed • Cache
              size • Number of cores
      - title: Embedded systems
        objectives:
          - ref: "1.1.3"
            foundation: >-
              The purpose and characteristics of embedded systems • Examples of embedded systems
  - ref: "1.2"
    title: Memory and storage
    subtopics:
      - title: Primary storage (memory)
        objectives:
          - ref: "1.2.1"
            foundation: >-
              The need for primary storage • The difference between RAM and ROM • The purpose of
              ROM in a computer system • The purpose of RAM in a computer system • Virtual memory
              • Cache
      - title: Secondary storage
        objectives:
          - ref: "1.2.2"
            foundation: >-
              The need for secondary storage • Common types of storage: • Optical • Magnetic •
              Solid state • Suitable storage devices and storage media for a given application •
              The advantages and disadvantages of different storage devices and storage media
              relating to these characteristics: • Capacity • Speed • Portability • Durability •
              Reliability • Cost
            out_of_scope: >-
              • Understanding of the component parts of these types of storage
      - title: Units
        objectives:
          - ref: "1.2.3"
            foundation: >-
              The units of data storage: • Bit • Nibble (4 bits) • Byte (8 bits) • Kilobyte (1,000
              bytes or 1 KB) • Megabyte (1,000 KB) • Gigabyte (1,000 MB) • Terabyte (1,000 GB) •
              Petabyte (1,000 TB) • How data needs to be converted into a binary format to be
              processed by a computer • Data capacity and calculation of data capacity
              requirements
      - title: Data storage
        objectives:
          - ref: "1.2.4"
            foundation: >-
              How to convert positive denary whole numbers to binary numbers (up to and including
              8 bits) and vice versa • How to add two binary integers together (up to and
              including 8 bits) and explain overflow errors which may occur • How to convert
              positive denary whole numbers into 2-digit hexadecimal numbers and vice versa • How
              to convert binary integers to their hexadecimal equivalents and vice versa • Binary
              shifts Characters • The use of binary codes to represent characters • The term
              ‘character set’ • The relationship between the number of bits per character in a
              character set, and the number of characters which can be represented, e.g.: • ASCII
              • Unicode Images • How an image is represented as a series of pixels, represented in
              binary • Metadata • The effect of colour depth and resolution on: • The quality of
              the image • The size of an image file Sound • How sound can be sampled and stored in
              digital form • The effect of sample rate, duration and bit depth on: • The playback
              quality • The size of a sound file
            out_of_scope: >-
              • Memorisation of character set codes
      - title: Compression
        objectives:
          - ref: "1.2.5"
            foundation: >-
              The need for compression • Types of compression: • Lossy • Lossless
            out_of_scope: >-
              • Ability to carry out specific compression algorithms
  - ref: "1.3"
    title: Computer networks, connections and protocols
    subtopics:
      - title: Networks and topologies
        objectives:
          - ref: "1.3.1"
            foundation: >-
              Types of network: • LAN (Local Area Network) • WAN (Wide Area Network) • Factors
              that affect the performance of networks • The different roles of computers in a
              client-server and a peer-to-peer network • The hardware needed to connect
              stand-alone computers into a Local Area Network: • Wireless access points • Routers
              • Switches • NIC (Network Interface Controller/Card) • Transmission media • The
              Internet as a worldwide collection of computer networks: • DNS (Domain Name Server)
              • Hosting • The Cloud • Web servers and clients • Star and Mesh network topologies
      - title: Wired and wireless networks, protocols and layers
        objectives:
          - ref: "1.3.2"
            foundation: >-
              Modes of connection: • Wired • Ethernet • Wireless • Wi-Fi • Bluetooth • Encryption
              • IP addressing and MAC addressing • Standards • Common protocols including: •
              TCP/IP (Transmission Control Protocol/Internet Protocol) • HTTP (Hyper Text Transfer
              Protocol) • HTTPS (Hyper Text Transfer Protocol Secure) • FTP (File Transfer
              Protocol) • POP (Post Office Protocol) • IMAP (Internet Message Access Protocol) •
              SMTP (Simple Mail Transfer Protocol) • The concept of layers
            out_of_scope: >-
              • Understand how Ethernet, Wi-Fi and Bluetooth protocols work • Understand
              differences between static and dynamic, or public and private IP addresses •
              Knowledge of individual standards • Knowledge of the names and function of each
              TCP/IP layer
  - ref: "1.4"
    title: Network security
    subtopics:
      - title: Threats to computer systems and networks
        objectives:
          - ref: "1.4.1"
            foundation: >-
              Forms of attack: • Malware • Social engineering, e.g. phishing, people as the ‘weak
              point’ • Brute-force attacks • Denial of service attacks • Data interception and
              theft • The concept of SQL injection
      - title: Identifying and preventing vulnerabilities
        objectives:
          - ref: "1.4.2"
            foundation: >-
              Common prevention methods: • Penetration testing • Anti-malware software • Firewalls
              • User access levels • Passwords • Encryption • Physical security
  - ref: "1.5"
    title: Systems software
    subtopics:
      - title: Operating systems
        objectives:
          - ref: "1.5.1"
            foundation: >-
              The purpose and functionality of operating systems: • User interface • Memory
              management and multitasking • Peripheral management and drivers • User management •
              File management
            out_of_scope: >-
              • Understanding of paging or segmentation
      - title: Utility software
        objectives:
          - ref: "1.5.2"
            foundation: >-
              The purpose and functionality of utility software • Utility system software: •
              Encryption software • Defragmentation • Data compression
  - ref: "1.6"
    title: "Ethical, legal, cultural and environmental impacts of digital technology"
    subtopics:
      - title: Ethical, legal, cultural and environmental impact
        objectives:
          - ref: "1.6.1"
            foundation: >-
              Impacts of digital technology on wider society including: • Ethical issues • Legal
              issues • Cultural issues • Environmental issues • Privacy issues • Legislation
              relevant to Computer Science: • The Data Protection Act 2018 • Computer Misuse Act
              1990 • Copyright Designs and Patents Act 1988 • Software licences (i.e. open source
              and proprietary) 2c. Content of Computational thinking, algorithms
  - ref: "2.1"
    title: Algorithms
    subtopics:
      - title: Computational thinking
        objectives:
          - ref: "2.1.1"
            foundation: >-
              Principles of computational thinking: • Abstraction • Decomposition • Algorithmic
              thinking
      - title: Designing, creating and refining algorithms
        objectives:
          - ref: "2.1.2"
            foundation: >-
              Identify the inputs, processes, and outputs for a problem • Structure diagrams •
              Create, interpret, correct, complete, and refine algorithms using: • Pseudocode •
              Flowcharts • Reference language/high-level programming language • Identify common
              errors • Trace tables
      - title: Searching and sorting algorithms
        objectives:
          - ref: "2.1.3"
            foundation: >-
              Standard searching algorithms: • Binary search • Linear search • Standard sorting
              algorithms: • Bubble sort • Merge sort • Insertion sort
            out_of_scope: >-
              • To remember the code, pseudocode or Exam Reference Language for these algorithms
  - ref: "2.2"
    title: Programming fundamentals
    subtopics:
      - title: Programming fundamentals
        objectives:
          - ref: "2.2.1"
            foundation: >-
              The use of variables, constants, operators, inputs, outputs and assignments • The
              use of the three basic programming constructs used to control the flow of a program:
              • Sequence • Selection • Iteration (count-and condition-controlled loops) • The
              common arithmetic operators • The common Boolean operators AND, OR and NOT
      - title: Data types
        objectives:
          - ref: "2.2.2"
            foundation: >-
              The use of data types: • Integer • Real • Boolean • Character and string • Casting
      - title: Additional programming techniques
        objectives:
          - ref: "2.2.3"
            foundation: >-
              The use of basic string manipulation • The use of basic file handling operations: •
              Open • Read • Write • Close • The use of records to store data • The use of SQL to
              search for data • The use of arrays (or equivalent) when solving problems, including
              both one-dimensional (1D) and two-dimensional arrays (2D) • How to use sub programs
              (functions and procedures) to produce structured code • Random number generation
  - ref: "2.3"
    title: Producing robust programs
    subtopics:
      - title: Defensive design
        objectives:
          - ref: "2.3.1"
            foundation: >-
              Defensive design considerations: • Anticipating misuse • Authentication • Input
              validation • Maintainability: • Use of sub programs • Naming conventions •
              Indentation • Commenting
      - title: Testing
        objectives:
          - ref: "2.3.2"
            foundation: >-
              The purpose of testing • Types of testing: • Iterative • Final/terminal • Identify
              syntax and logic errors • Selecting and using suitable test data: • Normal •
              Boundary • Invalid/Erroneous • Refining algorithms
  - ref: "2.4"
    title: Boolean logic
    subtopics:
      - title: Boolean logic
        objectives:
          - ref: "2.4.1"
            foundation: >-
              Simple logic diagrams using the operators AND, OR and NOT • Truth tables • Combining
              Boolean operators using AND, OR and NOT • Applying logical operators in truth tables
              to solve problems
  - ref: "2.5"
    title: Programming languages and Integrated Development Environments
    subtopics:
      - title: Languages
        objectives:
          - ref: "2.5.1"
            foundation: >-
              Characteristics and purpose of different levels of programming language: •
              High-level languages • Low-level languages • The purpose of translators • The
              characteristics of a compiler and an interpreter
            out_of_scope: >-
              • Understanding of assemblers
      - title: The Integrated Development Environment (IDE)
        objectives:
          - ref: "2.5.2"
            foundation: >-
              Common tools and facilities available in an Integrated Development Environment
              (IDE): • Editors • Error diagnostics • Run-time environment • Translators
