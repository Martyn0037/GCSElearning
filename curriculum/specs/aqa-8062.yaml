              beliefs on the following three issues with reference to the main religious tradition
              in Britain (Christianity) and one or more other religious traditions: • Corporal
              punishment. • Death penalty. • Forgiveness.
      - title: Religion, crime and the causes of crime
        objectives:
          - ref: "3.2.1.5.2"
            foundation: >-
              Good and evil intentions and actions, including whether it can ever be good to cause
