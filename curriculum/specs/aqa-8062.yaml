    title: "Theme G: St Mark’s gospel: the life of Jesus"
    subtopics:
      - title: The early ministry of Jesus
        objectives:
          - ref: "3.2.2.1.1"
            foundation: >-
              John’s preparation for Jesus’ ministry: 1:1–8.
          - ref: "3.2.2.1.2"
            foundation: >-
              Jesus’ baptism and temptation: 1:9–13.
          - ref: "3.2.2.1.3"
            foundation: >-
              The paralysed man: 2:1–12.
          - ref: "3.2.2.1.4"
            foundation: >-
              Jairus’ daughter: 5:21–24a, 35–43.
          - ref: "3.2.2.1.5"
            foundation: >-
              The rejection at Nazareth: 6:1–6.
          - ref: "3.2.2.1.6"
            foundation: >-
              The feeding of the five thousand: 6:30–44.
      - title: The later ministry of Jesus
        objectives:
          - ref: "3.2.2.1.7"
            foundation: >-
              The conversation at Caesarea Philippi: 8:27–33.
          - ref: "3.2.2.1.8"
            foundation: >-
              The transfiguration of Jesus: 9:2–9.
          - ref: "3.2.2.1.9"
            foundation: >-
              Jesus’ passion prediction: 10:32–34.
          - ref: "3.2.2.1.10"
            foundation: >-
              The request of James and John: 10:35–45.
          - ref: "3.2.2.1.11"
            foundation: >-
              Bartimaeus: 10:46–52.
          - ref: "3.2.2.1.12"
            foundation: >-
              The entry into Jerusalem: 11:1–11.
      - title: The final days in Jerusalem
        objectives:
          - ref: "3.2.2.1.13"
            foundation: >-
              The Last Supper: 14:12–26.
          - ref: "3.2.2.1.14"
            foundation: >-
              Jesus in Gethsemane: 14:32–52.
          - ref: "3.2.2.1.15"
            foundation: >-
              The trial before the Jewish authorities: 14:53, 57–65.
          - ref: "3.2.2.1.16"
            foundation: >-
              The trial before Pilate: 15:1–15.
          - ref: "3.2.2.1.17"
            foundation: >-
              The crucifixion and burial: 15:21–47.
          - ref: "3.2.2.1.18"
            foundation: >-
              The empty tomb: 16:1–8.
      - title: Significance
        objectives:
          - ref: "3.2.2.1.19"
            foundation: >-
              The titles Son of Man, Son of God, Christ (Messiah) and Son of David, including
              their meaning for 1st century Jews and Jesus.
          - ref: "3.2.2.1.20"
            foundation: >-
              The significance for 21st century Christians of Jesus’ understanding of the titles
              Son of Man, Son of God, Christ (Messiah) and Son of David.
          - ref: "3.2.2.1.21"
            foundation: >-
              St Mark’s portrayal of Jesus as a teacher and miracle worker, including contrasting
              views on the historicity of the miracle stories.
          - ref: "3.2.2.1.22"
            foundation: >-
              Differing beliefs about the meaning of Jesus’ words and actions at the Last Supper.
          - ref: "3.2.2.1.23"
            foundation: >-
              Differing beliefs about the significance of Jesus' death and resurrection, and
              different explanations given for the empty tomb.
          - ref: "3.2.2.1.24"
            foundation: >-
              Differing views on the authority of St Mark ’s Gospel relating to the life of Jesus
              in relation to the challenges posed by secular sources of contemporary authority.
