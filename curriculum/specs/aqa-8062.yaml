              The just war theory, including the criteria for a just war.
          - ref: "3.2.1.4.7"
            foundation: >-
              Holy war.
          - ref: "3.2.1.4.8"
            foundation: >-
              Pacifism.
      - title: Religion and belief in 21st century conflict
        objectives:
          - ref: "3.2.1.4.9"
