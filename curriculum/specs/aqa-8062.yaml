    title: "Theme H: St Mark’s Gospel as a source of religious, moral and spiritual truths"
    subtopics:
      - title: The Kingdom of God
        objectives:
          - ref: "3.2.2.2.1"
            foundation: >-
              Parable of the sower: 4:1–9, 14–20.
          - ref: "3.2.2.2.2"
            foundation: >-
              Parable of the growing seed: 4:26–29.
          - ref: "3.2.2.2.3"
            foundation: >-
              Parable of the mustard seed: 4:30–32.
          - ref: "3.2.2.2.4"
            foundation: >-
              Jesus and the children: 10:13–16.
          - ref: "3.2.2.2.5"
            foundation: >-
              The rich man: 10:17–27.
          - ref: "3.2.2.2.6"
            foundation: >-
              The greatest commandment: 12:28–34.
      - title: Jesus’ relationships with those disregarded by society
        objectives:
          - ref: "3.2.2.2.7"
            foundation: >-
              The man with leprosy: 1:40–45.
          - ref: "3.2.2.2.8"
            foundation: >-
              The call of Levi: 2:13–17.
          - ref: "3.2.2.2.9"
            foundation: >-
              The Greek (Syro-Phoenician) woman’s daughter: 7:24–30.
          - ref: "3.2.2.2.10"
            foundation: >-
              The epileptic (demon-possessed) boy: 9:14–29.
          - ref: "3.2.2.2.11"
            foundation: >-
              The widow at the treasury: 12:41–44.
          - ref: "3.2.2.2.12"
            foundation: >-
              The anointing at Bethany: 14:1–9.
      - title: Faith and discipleship
        objectives:
          - ref: "3.2.2.2.13"
            foundation: >-
              The call of the first disciples: 1:16–20.
          - ref: "3.2.2.2.14"
            foundation: >-
              The woman with a haemorrhage: 5:24b–34.
          - ref: "3.2.2.2.15"
            foundation: >-
              The mission of the Twelve: 6:7–13.
          - ref: "3.2.2.2.16"
            foundation: >-
              The cost and rewards of discipleship: 8:34–38; 10:28–31.
          - ref: "3.2.2.2.17"
            foundation: >-
              Peter’s denials: 14:27–31, 66–72.
          - ref: "3.2.2.2.18"
            foundation: >-
              The commission and ascension: 16:14–20.
