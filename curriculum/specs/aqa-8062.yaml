              The purpose of families, including: • procreation • stability and the protection of
              children • educating children in a faith.
          - ref: "3.2.1.1.11"
            foundation: >-
              Contemporary family issues including: • same-sex parents • polygamy.
          - ref: "3.2.1.1.12"
            foundation: >-
              The roles of men and women.
          - ref: "3.2.1.1.13"
            foundation: >-
              Gender equality.
          - ref: "3.2.1.1.14"
            foundation: >-
              Gender prejudice and discrimination, including examples.
  - ref: "3.2.1.2"
    title: "Theme B: Religion and life"
    subtopics:
      - title: "Theme B: Religion and life"
        objectives:
          - ref: "3.2.1.2.1"
            foundation: >-
              Students should study religious teachings, and religious, philosophical and ethical
              arguments, relating to the issues that follow, and their impact and influence in the
              modern world. They should be aware of contrasting perspectives in contemporary
              British society on all of these issues. They must be able to explain contrasting
              beliefs on the following three issues with reference to the main religious tradition
              in Britain (Christianity) and one or more other religious traditions: • Abortion. •
              Euthanasia. • Animal experimentation.
      - title: The origins and value of the universe
        objectives:
          - ref: "3.2.1.2.2"
            foundation: >-
              The origins of the universe, including: • religious teachings about the origins of
              the universe, and different interpretations of these • the relationship between
              scientific views, such as the Big Bang theory, and religious views.
          - ref: "3.2.1.2.3"
            foundation: >-
              The value of the world and the duty of human beings to protect it, including
              religious teaching about stewardship, dominion, responsibility, awe and wonder.
          - ref: "3.2.1.2.4"
            foundation: >-
              The use and abuse of the environment, including the use of natural resources,
              pollution.
          - ref: "3.2.1.2.5"
            foundation: >-
              The use and abuse of animals, including: • animal experimentation • the use of
              animals for food.
      - title: The origins and value of human life
        objectives:
          - ref: "3.2.1.2.6"
            foundation: >-
              The origins of life, including: • religious teachings about the origins of human
              life, and different interpretations of these • the relationship between scientific
              views, such as evolution, and religious views.
          - ref: "3.2.1.2.7"
            foundation: >-
              The concepts of sanctity of life and the quality of life.
          - ref: "3.2.1.2.8"
            foundation: >-
              Abortion, including situations when the mother's life is at risk.
          - ref: "3.2.1.2.9"
            foundation: >-
              Ethical arguments related to abortion, including those based on the sanctity of life
              and quality of life.
          - ref: "3.2.1.2.10"
            foundation: >-
              Euthanasia.
          - ref: "3.2.1.2.11"
            foundation: >-
              Beliefs about death and an afterlife, and their impact on beliefs about the value of
              human life.
  - ref: "3.2.1.3"
    title: "Theme C: The existence of God and revelation"
    subtopics:
      - title: "Theme C: The existence of God and revelation"
        objectives:
          - ref: "3.2.1.3.1"
            foundation: >-
              Students should study religious teachings, and religious and philosophical
              arguments, relating to the issues that follow, and their impact and influence in the
              modern world. They should be aware of contrasting perspectives in contemporary
              British society on all of these issues. They must be able to explain contrasting
              beliefs on the following three issues with reference to the main religious tradition
              in Britain (Christianity) and non-religious beliefs such as atheism and humanism: •
              Visions. • Miracles. • Nature as general revelation.
      - title: Philosophical arguments for and against the existence of God
        objectives:
          - ref: "3.2.1.3.2"
            foundation: >-
              The Design argument, including its strengths and weaknesses.
          - ref: "3.2.1.3.3"
            foundation: >-
              The First Cause argument, including its strengths and weaknesses.
          - ref: "3.2.1.3.4"
            foundation: >-
              The argument from miracles, including its strengths and weaknesses, and one example
              of a miracle.
          - ref: "3.2.1.3.5"
            foundation: >-
              Evil and suffering as an argument against the existence of God.
          - ref: "3.2.1.3.6"
            foundation: >-
              Arguments based on science against the existence of God.
      - title: The nature of the divine and revelation
        objectives:
          - ref: "3.2.1.3.7"
            foundation: >-
              Special revelation as a source of knowledge about the divine (God, gods or ultimate
              reality) including visions and one example of a vision.
          - ref: "3.2.1.3.8"
            foundation: >-
              Enlightenment as a source of knowledge about the divine.
          - ref: "3.2.1.3.9"
            foundation: >-
              General revelation: nature and scripture as a way of understanding the divine.
          - ref: "3.2.1.3.10"
            foundation: >-
              Different ideas about the divine that come from these sources: • omnipotent and
              omniscient • personal and impersonal • immanent and transcendent.
          - ref: "3.2.1.3.11"
            foundation: >-
              The value of general and special revelation and enlightenment as sources of
              knowledge about the divine, including: • the problems of different ideas about the
              divine arising from these experiences • alternative explanations for the
              experiences, and the possibility that the people who claimed to have them were lying
              or mistaken. GCSE Religious Studies A 8062. GCSE exams June 2018 onwards. Version
              1.2 10 November 2017
