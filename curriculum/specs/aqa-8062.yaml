          - ref: "3.2.1.5.4"
            foundation: >-
              Views about people who break the law for these reasons.
          - ref: "3.2.1.5.5"
            foundation: >-
              Views about different types of crime, including hate crimes, theft and murder.
      - title: Religion and punishment
        objectives:
