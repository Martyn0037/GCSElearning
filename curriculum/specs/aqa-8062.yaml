            foundation: >-
              Students should study religious teachings, and religious, philosophical and ethical
              arguments, relating to the issues that follow, and their impact and influence in the
              modern world. They should be aware of contrasting perspectives in contemporary
              British society on all of these issues. They must be able to explain contrasting
              beliefs on the following three issues with reference to the main religious tradition
              in Britain (Christianity) and one or more other religious traditions: • Violence. •
              Weapons of mass destruction. • Pacifism.
      - title: Religion, violence, terrorism and war
        objectives:
          - ref: "3.2.1.4.2"
            foundation: >-
              The meaning and significance of: • peace • justice • forgiveness • reconciliation.
          - ref: "3.2.1.4.3"
            foundation: >-
              Violence, including violent protest.
          - ref: "3.2.1.4.4"
            foundation: >-
              Terrorism.
          - ref: "3.2.1.4.5"
            foundation: >-
              Reasons for war, including greed, self-defence and retaliation.
          - ref: "3.2.1.4.6"
