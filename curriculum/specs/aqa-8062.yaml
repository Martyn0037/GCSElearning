          - ref: "3.2.2.2.24"
            foundation: >-
              Different views on the nature and importance of faith as seen in St Mark’s Gospel.
          - ref: "3.2.2.2.25"
            foundation: >-
              Differing views on the authority of Jesus’ teaching as recorded by St Mark in
              relation to the challenges posed by secular sources of contemporary authority. GCSE
              Religious Studies A 8062. GCSE exams June 2018 onwards. Version 1.2 10 November 2017
