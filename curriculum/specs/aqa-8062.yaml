              Nuclear weapons, including nuclear deterrence.
          - ref: "3.2.1.4.11"
            foundation: >-
              The use of weapons of mass destruction.
          - ref: "3.2.1.4.12"
            foundation: >-
              Religion and peace-making in the contemporary world including the work of
