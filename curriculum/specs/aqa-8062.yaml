              British society on all of these issues. They must be able to explain contrasting
              beliefs on the following three issues with reference to the main religious tradition
              in Britain (Christianity) and one or more other religious traditions: • Status of
              women in religion. • The uses of wealth. • Freedom of religious expression.
      - title: Human rights
        objectives:
          - ref: "3.2.1.6.2"
            foundation: >-
              Prejudice and discrimination in religion and belief, including the status and
              treatment within religion of women and homosexuals.
          - ref: "3.2.1.6.3"
            foundation: >-
              Issues of equality, freedom of religion and belief including freedom of religious
              expression.
          - ref: "3.2.1.6.4"
            foundation: >-
              Human rights and the responsibilities that come with rights, including the
