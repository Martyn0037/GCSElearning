            foundation: >-
              The aims of punishment, including: • retribution • deterrence • reformation.
          - ref: "3.2.1.5.7"
            foundation: >-
              The treatment of criminals, including: • prison • corporal punishment • community
              service.
          - ref: "3.2.1.5.8"
            foundation: >-
              Forgiveness.
          - ref: "3.2.1.5.9"
            foundation: >-
              The death penalty.
