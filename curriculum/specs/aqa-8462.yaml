# curriculum/specs/aqa-8462.yaml
# AQA GCSE Chemistry 8462, subject content copied word for word from the
# specification PDF (Version 1.1 04 October 2019).
#
# How it was transcribed (see curriculum/README.md):
# - Each numbered content unit (e.g. 4.1.1.1) is one statement: its "Content"
#   column. The "Key opportunities for skills development" column and the
#   practical-activity administration notes are not included.
# - "foundation" leaves out paragraphs and bullets marked (HT only); "higher"
#   is the full text. Units whose heading says (HT only) are Higher only.
# - Sub- and superscripts are written as Unicode (CO₂, m/s²). Equations whose
#   fractions the PDF typesets are written in LaTeX between $…$.
# - Diagrams, structural formulae, symbols and tables that the PDF prints as
#   images are not reproduced; where a sentence introduces one, it is left
#   as printed.

specification:
  board: aqa
  subject: chemistry
  code: "8462"
  title: AQA GCSE Chemistry
  version: Version 1.1 04 October 2019
  source_url: "https://filestore.aqa.org.uk/resources/chemistry/specifications/AQA-8462-SP-2016.PDF"
  tiered: true

topics:
  - ref: "4.1"
    title: Atomic structure and the periodic table
    subtopics:
      - title: A simple model of the atom, symbols, relative atomic mass,
        objectives:
          - ref: "4.1.1.1"
            foundation: >-
              All substances are made of atoms. An atom is the smallest part of an element that
              can exist. Atoms of each element are represented by a chemical symbol, eg O
              represents an atom of oxygen, Na represents an atom of sodium. There are about 100
              different elements. Elements are shown in the periodic table. Compounds are formed
              from elements by chemical reactions. Chemical reactions always involve the formation
              of one or more new substances, and often involve a detectable energy change.
              Compounds contain two or more elements chemically combined in fixed proportions and
              can be represented by formulae using the symbols of the atoms from which they were
              formed. Compounds can only be separated into elements by chemical reactions.
              Chemical reactions can be represented by word equations or equations using symbols
              and formulae. Students will be supplied with a periodic table for the exam and
              should be able to: • use the names and symbols of the first 20 elements in the
              periodic table, the elements in Groups 1 and 7, and other elements in this
              specification • name compounds of these elements from given formulae or symbol
              equations • write word equations for the reactions in this specification • write
              formulae and balanced chemical equations for the reactions in this specification.
            higher: >-
              All substances are made of atoms. An atom is the smallest part of an element that
              can exist. Atoms of each element are represented by a chemical symbol, eg O
              represents an atom of oxygen, Na represents an atom of sodium. There are about 100
              different elements. Elements are shown in the periodic table. Compounds are formed
              from elements by chemical reactions. Chemical reactions always involve the formation
              of one or more new substances, and often involve a detectable energy change.
              Compounds contain two or more elements chemically combined in fixed proportions and
              can be represented by formulae using the symbols of the atoms from which they were
              formed. Compounds can only be separated into elements by chemical reactions.
              Chemical reactions can be represented by word equations or equations using symbols
              and formulae. Students will be supplied with a periodic table for the exam and
              should be able to: • use the names and symbols of the first 20 elements in the
              periodic table, the elements in Groups 1 and 7, and other elements in this
              specification • name compounds of these elements from given formulae or symbol
              equations • write word equations for the reactions in this specification • write
              formulae and balanced chemical equations for the reactions in this specification.
              (HT only) write balanced half equations and ionic equations where appropriate.
          - ref: "4.1.1.2"
            foundation: >-
              A mixture consists of two or more elements or compounds not chemically combined
              together. The chemical properties of each substance in the mixture are unchanged.
              Mixtures can be separated by physical processes such as filtration, crystallisation,
              simple distillation, fractional distillation and chromatography. These physical
              processes do not involve chemical reactions and no new substances are made. Students
              should be able to: • describe, explain and give examples of the specified processes
              of separation • suggest suitable separation and purification techniques for mixtures
              when given appropriate information.
          - ref: "4.1.1.3"
            foundation: >-
              New experimental evidence may lead to a scientific model being changed or replaced.
              Before the discovery of the electron, atoms were thought to be tiny spheres that
              could not be divided. The discovery of the electron led to the plum pudding model of
              the atom. The plum pudding model suggested that the atom is a ball of positive
              charge with negative electrons embedded in it. The results from the alpha particle
              scattering experiment led to the conclusion that the mass of an atom was
              concentrated at the centre (nucleus) and that the nucleus was charged. This nuclear
              model replaced the plum pudding model. Niels Bohr adapted the nuclear model by
              suggesting that electrons orbit the nucleus at specific distances. The theoretical
              calculations of Bohr agreed with experimental observations. Later experiments led to
              the idea that the positive charge of any nucleus could be subdivided into a whole
              number of smaller particles, each particle having the same amount of positive
              charge. The name proton was given to these particles. The experimental work of James
              Chadwick provided the evidence to show the existence of neutrons within the nucleus.
              This was about 20 years after the nucleus became an accepted scientific idea.
              Students should be able to describe: • why the new evidence from the scattering
              experiment led to a change in the atomic model • the difference between the plum
              pudding model of the atom and the nuclear model of the atom. Details of experimental
              work supporting the Bohr model are not required. Details of Chadwick’s experimental
              work are not required.
          - ref: "4.1.1.4"
            foundation: >-
              The relative electrical charges of the particles in atoms are: In an atom, the
              number of electrons is equal to the number of protons in the nucleus. Atoms have no
              overall electrical charge. The number of protons in an atom of an element is its
              atomic number. All atoms of a particular element have the same number of protons.
              Atoms of different elements have different numbers of protons. Students should be
              able to use the nuclear model to describe atoms.
          - ref: "4.1.1.5"
            foundation: >-
              Atoms are very small, having a radius of about 0.1 nm (1 x 10⁻¹⁰ m). The radius of a
              nucleus is less than 1/10 000 of that of the atom (about 1 x 10⁻¹⁴ m). Almost all of
              the mass of an atom is in the nucleus. The relative masses of protons, neutrons and
              electrons are: The sum of the protons and neutrons in an atom is its mass number.
              Atoms of the same element can have different numbers of neutrons; these atoms are
              called isotopes of that element. Atoms can be represented as shown in this example:
              Students should be able to calculate the numbers of protons, neutrons and electrons
              in an atom or ion, given its atomic number and mass number. Students should be able
              to relate size and scale of atoms to objects in the physical world.
          - ref: "4.1.1.6"
            foundation: >-
              The relative atomic mass of an element is an average value that takes account of the
              abundance of the isotopes of the element. Students should be able to calculate the
              relative atomic mass of an element given the percentage abundance of its isotopes.
          - ref: "4.1.1.7"
            foundation: >-
              The electrons in an atom occupy the lowest available energy levels (innermost
              available shells). The electronic structure of an atom can be represented by numbers
              or by a diagram. For example, the electronic structure of sodium is 2,8,1 or showing
              two electrons in the lowest energy level, eight in the second energy level and one
              in the third energy level. Students may answer questions in terms of either energy
              levels or shells.
      - title: The periodic table
        objectives:
          - ref: "4.1.2.1"
            foundation: >-
              The elements in the periodic table are arranged in order of atomic (proton) number
              and so that elements with similar properties are in columns, known as groups. The
              table is called a periodic table because similar properties occur at regular
              intervals. Elements in the same group in the periodic table have the same number of
              electrons in their outer shell (outer electrons) and this gives them similar
              chemical properties. Students should be able to: • explain how the position of an
              element in the periodic table is related to the arrangement of electrons in its
              atoms and hence to its atomic number • predict possible reactions and probable
              reactivity of elements from their positions in the periodic table.
          - ref: "4.1.2.2"
            foundation: >-
              Before the discovery of protons, neutrons and electrons, scientists attempted to
              classify the elements by arranging them in order of their atomic weights. The early
              periodic tables were incomplete and some elements were placed in inappropriate
              groups if the strict order of atomic weights was followed. Mendeleev overcame some
              of the problems by leaving gaps for elements that he thought had not been discovered
              and in some places changed the order based on atomic weights. Elements with
              properties predicted by Mendeleev were discovered and filled the gaps. Knowledge of
              isotopes made it possible to explain why the order based on atomic weights was not
              always correct. Students should be able to describe these steps in the development
              of the periodic table.
          - ref: "4.1.2.3"
            foundation: >-
              Elements that react to form positive ions are metals. Elements that do not form
              positive ions are non-metals. The majority of elements are metals. Metals are found
              to the left and towards the bottom of the periodic table. Non-metals are found
              towards the right and top of the periodic table. Students should be able to: •
              explain the differences between metals and non-metals on the basis of their
              characteristic physical and chemical properties. This links to Group 0 (page 24),
              Group 1 (page 24), Group 7 (page 25) and Bonding, structure and the properties of
              matter (page 26) • explain how the atomic structure of metals and non-metals relates
              to their position in the periodic table • explain how the reactions of elements are
              related to the arrangement of electrons in their atoms and hence to their atomic
              number.
          - ref: "4.1.2.4"
            foundation: >-
              The elements in Group 0 of the periodic table are called the noble gases. They are
              unreactive and do not easily form molecules because their atoms have stable
              arrangements of electrons. The noble gases have eight electrons in their outer
              shell, except for helium, which has only two electrons. The boiling points of the
              noble gases increase with increasing relative atomic mass (going down the group).
              Students should be able to: • explain how properties of the elements in Group 0
              depend on the outer shell of electrons of the atoms • predict properties from given
              trends down the group.
          - ref: "4.1.2.5"
            foundation: >-
              The elements in Group 1 of the periodic table are known as the alkali metals and
              have characteristic properties because of the single electron in their outer shell.
              Students should be able to describe the reactions of the first three alkali metals
              with oxygen, chlorine and water. In Group 1, the reactivity of the elements
              increases going down the group. Students should be able to: • explain how properties
              of the elements in Group 1 depend on the outer shell of electrons of the atoms •
              predict properties from given trends down the group.
          - ref: "4.1.2.6"
            foundation: >-
              The elements in Group 7 of the periodic table are known as the halogens and have
              similar reactions because they all have seven electrons in their outer shell. The
              halogens are non-metals and consist of molecules made of pairs of atoms. Students
              should be able to describe the nature of the compounds formed when chlorine, bromine
              and iodine react with metals and non-metals. In Group 7, the further down the group
              an element is the higher its relative molecular mass, melting point and boiling
              point. In Group 7, the reactivity of the elements decreases going down the group. A
              more reactive halogen can displace a less reactive halogen from an aqueous solution
              of its salt. Students should be able to: • explain how properties of the elements in
              Group 7 depend on the outer shell of electrons of the atoms • predict properties
              from given trends down the group.
      - title: Properties of transition metals (chemistry only)
        objectives:
          - ref: "4.1.3.1"
            foundation: >-
              The transition elements are metals with similar properties which are different from
              those of the elements in Group 1. Students should be able to describe the difference
              compared with Group 1 in melting points, densities, strength, hardness and
              reactivity with oxygen, water and halogens. Students should be able to exemplify
              these general properties by reference to Cr, Mn, Fe, Co, Ni, Cu.
          - ref: "4.1.3.2"
            foundation: >-
              Many transition elements have ions with different charges, form coloured compounds
              and are useful as catalysts. Students should be able to exemplify these general
              properties by reference to compounds of Cr, Mn, Fe, Co, Ni, Cu.
  - ref: "4.2"
    title: Bonding, structure, and the properties of matter
    subtopics:
      - title: Chemical bonds, ionic, covalent and metallic
        objectives:
          - ref: "4.2.1.1"
            foundation: >-
              There are three types of strong chemical bonds: ionic, covalent and metallic. For
              ionic bonding the particles are oppositely charged ions. For covalent bonding the
              particles are atoms which share pairs of electrons. For metallic bonding the
              particles are atoms which share delocalised electrons. Ionic bonding occurs in
              compounds formed from metals combined with non-metals. Covalent bonding occurs in
              most non-metallic elements and in compounds of non-metals. Metallic bonding occurs
              in metallic elements and alloys. Students should be able to explain chemical bonding
              in terms of electrostatic forces and the transfer or sharing of electrons.
          - ref: "4.2.1.2"
            foundation: >-
              When a metal atom reacts with a non-metal atom electrons in the outer shell of the
              metal atom are transferred. Metal atoms lose electrons to become positively charged
              ions. Non-metal atoms gain electrons to become negatively charged ions. The ions
              produced by metals in Groups 1 and 2 and by non-metals in Groups 6 and 7 have the
              electronic structure of a noble gas (Group 0). The electron transfer during the
              formation of an ionic compound can be represented by a dot and cross diagram, eg for
              sodium chloride Students should be able to draw dot and cross diagrams for ionic
              compounds formed by metals in Groups 1 and 2 with non-metals in Groups 6 and 7. The
              charge on the ions produced by metals in Groups 1 and 2 and by non-metals in Groups
              6 and 7 relates to the group number of the element in the periodic table. Students
              should be able to work out the charge on the ions of metals and non-metals from the
              group number of the element, limited to the metals in Groups 1 and 2, and non-metals
              in Groups 6 and 7.
          - ref: "4.2.1.3"
            foundation: >-
              An ionic compound is a giant structure of ions. Ionic compounds are held together by
              strong electrostatic forces of attraction between oppositely charged ions. These
              forces act in all directions in the lattice and this is called ionic bonding. The
              structure of sodium chloride can be represented in the following forms: Students
              should be able to: • deduce that a compound is ionic from a diagram of its structure
              in one of the specified forms • describe the limitations of using dot and cross,
              ball and stick, two and three-dimensional diagrams to represent a giant ionic
              structure • work out the empirical formula of an ionic compound from a given model
              or diagram that shows the ions in the structure. Students should be familiar with
              the structure of sodium chloride but do not need to know the structures of other
              ionic compounds.
          - ref: "4.2.1.4"
            foundation: >-
              When atoms share pairs of electrons, they form covalent bonds. These bonds between
              atoms are strong. Covalently bonded substances may consist of small molecules.
              Students should be able to recognise common substances that consist of small
              molecules from their chemical formula. Some covalently bonded substances have very
              large molecules, such as polymers. Some covalently bonded substances have giant
              covalent structures, such as diamond and silicon dioxide. The covalent bonds in
              molecules and giant structures can be represented in the following forms: Polymers
              can be represented in the form: where n is a large number. Students should be able
              to: • draw dot and cross diagrams for the molecules of hydrogen, chlorine, oxygen,
              nitrogen, hydrogen chloride, water, ammonia and methane • represent the covalent
              bonds in small molecules, in the repeating units of polymers and in part of giant
              covalent structures, using a line to represent a single bond • describe the
              limitations of using dot and cross, ball and stick, two and three-dimensional
              diagrams to represent molecules or giant structures • deduce the molecular formula
              of a substance from a given model or diagram in these forms showing the atoms and
              bonds in the molecule.
          - ref: "4.2.1.5"
            foundation: >-
              Metals consist of giant structures of atoms arranged in a regular pattern. The
              electrons in the outer shell of metal atoms are delocalised and so are free to move
              through the whole structure. The sharing of delocalised electrons gives rise to
              strong metallic bonds. The bonding in metals may be represented in the following
              form:
      - title: How bonding and structure are related to the properties of
        objectives:
          - ref: "4.2.2.1"
            foundation: >-
              The three states of matter are solid, liquid and gas. Melting and freezing take
              place at the melting point, boiling and condensing take place at the boiling point.
              The three states of matter can be represented by a simple model. In this model,
              particles are represented by small solid spheres. Particle theory can help to
              explain melting, boiling, freezing and condensing. The amount of energy needed to
              change state from solid to liquid and from liquid to gas depends on the strength of
              the forces between the particles of the substance. The nature of the particles
              involved depends on the type of bonding and the structure of the substance. The
              stronger the forces between the particles the higher the melting point and boiling
              point of the substance. Students should be able to: • predict the states of
              substances at different temperatures given appropriate data • explain the different
              temperatures at which changes of state occur in terms of energy transfers and types
              of bonding • recognise that atoms themselves do not have the bulk properties of
              materials
            higher: >-
              The three states of matter are solid, liquid and gas. Melting and freezing take
              place at the melting point, boiling and condensing take place at the boiling point.
              The three states of matter can be represented by a simple model. In this model,
              particles are represented by small solid spheres. Particle theory can help to
              explain melting, boiling, freezing and condensing. The amount of energy needed to
              change state from solid to liquid and from liquid to gas depends on the strength of
              the forces between the particles of the substance. The nature of the particles
              involved depends on the type of bonding and the structure of the substance. The
              stronger the forces between the particles the higher the melting point and boiling
              point of the substance. (HT only) Limitations of the simple model above include that
              in the model there are no forces, that all particles are represented as spheres and
              that the spheres are solid. Students should be able to: • predict the states of
              substances at different temperatures given appropriate data • explain the different
              temperatures at which changes of state occur in terms of energy transfers and types
              of bonding • recognise that atoms themselves do not have the bulk properties of
              materials • (HT only) explain the limitations of the particle theory in relation to
              changes of state when particles are represented by solid inelastic spheres which
              have no forces between them.
          - ref: "4.2.2.2"
            foundation: >-
              In chemical equations, the three states of matter are shown as (s), (l) and (g),
              with (aq) for aqueous solutions. Students should be able to include appropriate
              state symbols in chemical equations for the reactions in this specification.
          - ref: "4.2.2.3"
            foundation: >-
              Ionic compounds have regular structures (giant ionic lattices) in which there are
              strong electrostatic forces of attraction in all directions between oppositely
              charged ions. These compounds have high melting points and high boiling points
              because of the large amounts of energy needed to break the many strong bonds. When
              melted or dissolved in water, ionic compounds conduct electricity because the ions
              are free to move and so charge can flow. Knowledge of the structures of specific
              ionic compounds other than sodium chloride is not required.
          - ref: "4.2.2.4"
            foundation: >-
              Substances that consist of small molecules are usually gases or liquids that have
              relatively low melting points and boiling points. These substances have only weak
              forces between the molecules (intermolecular forces). It is these intermolecular
              forces that are overcome, not the covalent bonds, when the substance melts or boils.
              The intermolecular forces increase with the size of the molecules, so larger
              molecules have higher melting and boiling points. These substances do not conduct
              electricity because the molecules do not have an overall electric charge. Students
              should be able to use the idea that intermolecular forces are weak compared with
              covalent bonds to explain the bulk properties of molecular substances.
          - ref: "4.2.2.5"
            foundation: >-
              Polymers have very large molecules. The atoms in the polymer molecules are linked to
              other atoms by strong covalent bonds. The intermolecular forces between polymer
              molecules are relatively strong and so these substances are solids at room
              temperature. Students should be able to recognise polymers from diagrams showing
              their bonding and structure.
          - ref: "4.2.2.6"
            foundation: >-
              Substances that consist of giant covalent structures are solids with very high
              melting points. All of the atoms in these structures are linked to other atoms by
              strong covalent bonds. These bonds must be overcome to melt or boil these
              substances. Diamond and graphite (forms of carbon) and silicon dioxide (silica) are
              examples of giant covalent structures. Students should be able to recognise giant
              covalent structures from diagrams showing their bonding and structure.
          - ref: "4.2.2.7"
            foundation: >-
              Metals have giant structures of atoms with strong metallic bonding. This means that
              most metals have high melting and boiling points. In pure metals, atoms are arranged
              in layers, which allows metals to be bent and shaped. Pure metals are too soft for
              many uses and so are mixed with other metals to make alloys which are harder.
              Students should be able to explain why alloys are harder than pure metals in terms
              of distortion of the layers of atoms in the structure of a pure metal.
          - ref: "4.2.2.8"
            foundation: >-
              Metals are good conductors of electricity because the delocalised electrons in the
              metal carry electrical charge through the metal. Metals are good conductors of
              thermal energy because energy is transferred by the delocalised electrons.
      - title: Structure and bonding of carbon
        objectives:
          - ref: "4.2.3.1"
            foundation: >-
              In diamond, each carbon atom forms four covalent bonds with other carbon atoms in a
              giant covalent structure, so diamond is very hard, has a very high melting point and
              does not conduct electricity. Students should be able to explain the properties of
              diamond in terms of its structure and bonding.
          - ref: "4.2.3.2"
            foundation: >-
              In graphite, each carbon atom forms three covalent bonds with three other carbon
              atoms, forming layers of hexagonal rings which have no covalent bonds between the
              layers. In graphite, one electron from each carbon atom is delocalised. Students
              should be able to explain the properties of graphite in terms of its structure and
              bonding. Students should know that graphite is similar to metals in that it has
              delocalised electrons.
          - ref: "4.2.3.3"
            foundation: >-
              Graphene is a single layer of graphite and has properties that make it useful in
              electronics and composites. Students should be able to explain the properties of
              graphene in terms of its structure and bonding. Fullerenes are molecules of carbon
              atoms with hollow shapes. The structure of fullerenes is based on hexagonal rings of
              carbon atoms but they may also contain rings with five or seven carbon atoms. The
              first fullerene to be discovered was Buckminsterfullerene (C₆₀ ) which has a
              spherical shape. Carbon nanotubes are cylindrical fullerenes with very high length
              to diameter ratios. Their properties make them useful for nanotechnology,
              electronics and materials. Students should be able to: • recognise graphene and
              fullerenes from diagrams and descriptions of their bonding and structure • give
              examples of the uses of fullerenes, including carbon nanotubes.
      - title: Bulk and surface properties of matter including nanoparticles
        objectives:
          - ref: "4.2.4.1"
            foundation: >-
              Nanoscience refers to structures that are 1–100 nm in size, of the order of a few
              hundred atoms. Nanoparticles, are smaller than fine particles (PM₂.₅ ), which have
              diameters between 100 and 2500 nm (1 x 10⁻⁷ m and 2.5 x 10⁻⁶ m). Coarse particles
              (PM₁₀ ) have diameters between 1 x 10⁻⁵ m and 2.5 x 10⁻⁶ m. Coarse particles are
              often referred to as dust. As the side of cube decreases by a factor of 10 the
              surface area to volume ratio increases by a factor of 10. Nanoparticles may have
              properties different from those for the same materials in bulk because of their high
              surface area to volume ratio. It may also mean that smaller quantities are needed to
              be effective than for materials with normal particle sizes. Students should be able
              to compare ‘nano’ dimensions to typical dimensions of atoms and molecules.
          - ref: "4.2.4.2"
            foundation: >-
              Nanoparticles have many applications in medicine, in electronics, in cosmetics and
              sun creams, as deodorants, and as catalysts. New applications for nanoparticulate
              materials are an important area of research. Students should consider advantages and
              disadvantages of the applications of these nanoparticulate materials, but do not
              need to know specific examples or properties other than those specified. Students
              should be able to: • given appropriate information, evaluate the use of
              nanoparticles for a specified purpose • explain that there are possible risks
              associated with the use of nanoparticles.
  - ref: "4.3"
    title: Quantitative chemistry
    subtopics:
      - title: Chemical measurements, conservation of mass and the
        objectives:
          - ref: "4.3.1.1"
            foundation: >-
              The law of conservation of mass states that no atoms are lost or made during a
              chemical reaction so the mass of the products equals the mass of the reactants. This
              means that chemical reactions can be represented by symbol equations which are
              balanced in terms of the numbers of atoms of each element involved on both sides of
              the equation. Students should understand the use of the multipliers in equations in
              normal script before a formula and in subscript within a formula.
          - ref: "4.3.1.2"
            foundation: >-
              The relative formula mass (Mr ) of a compound is the sum of the relative atomic
              masses of the atoms in the numbers shown in the formula. In a balanced chemical
              equation, the sum of the relative formula masses of the reactants in the quantities
              shown equals the sum of the relative formula masses of the products in the
              quantities shown. Students should be able to calculate the percentage by mass in a
              compound given the relative formula mass and the relative atomic masses.
          - ref: "4.3.1.3"
            foundation: >-
              Some reactions may appear to involve a change in mass but this can usually be
              explained because a reactant or product is a gas and its mass has not been taken
              into account. For example: when a metal reacts with oxygen the mass of the oxide
              produced is greater than the mass of the metal or in thermal decompositions of metal
              carbonates carbon dioxide is produced and escapes into the atmosphere leaving the
              metal oxide as the only solid product. Students should be able to explain any
              observed changes in mass in non-enclosed systems during a chemical reaction given
              the balanced symbol equation for the reaction and explain these changes in terms of
              the particle model.
          - ref: "4.3.1.4"
            foundation: >-
              Whenever a measurement is made there is always some uncertainty about the result
              obtained. Students should be able to: • represent the distribution of results and
              make estimations of uncertainty • use the range of a set of measurements about the
              mean as a measure of uncertainty.
      - title: Use of amount of substance in relation to masses of pure
        objectives:
          - ref: "4.3.2.1"
            higher: >-
              Chemical amounts are measured in moles. The symbol for the unit mole is mol. The
              mass of one mole of a substance in grams is numerically equal to its relative
              formula mass. One mole of a substance contains the same number of the stated
              particles, atoms, molecules or ions as one mole of any other substance. The number
              of atoms, molecules or ions in a mole of a given substance is the Avogadro constant.
              The value of the Avogadro constant is 6.02 x 10²³ per mole. Students should
              understand that the measurement of amounts in moles can apply to atoms, molecules,
              ions, electrons, formulae and equations, for example that in one mole of carbon (C)
              the number of atoms is the same as the number of molecules in one mole of carbon
              dioxide (CO₂ ). Students should be able to use the relative formula mass of a
              substance to calculate the number of moles in a given mass of that substance and
              vice versa.
          - ref: "4.3.2.2"
            higher: >-
              The masses of reactants and products can be calculated from balanced symbol
              equations. Chemical equations can be interpreted in terms of moles. For example: Mg
              + 2HCI MgCI₂ + H₂ shows that one mole of magnesium reacts with two moles of
              hydrochloric acid to produce one mole of magnesium chloride and one mole of hydrogen
              gas. Students should be able to: • calculate the masses of substances shown in a
              balanced symbol equation • calculate the masses of reactants and products from the
              balanced symbol equation and the mass of a given reactant or product.
          - ref: "4.3.2.3"
            higher: >-
              The balancing numbers in a symbol equation can be calculated from the masses of
              reactants and products by converting the masses in grams to amounts in moles and
              converting the numbers of moles to simple whole number ratios. Students should be
              able to balance an equation given the masses of reactants and products. Students
              should be able to change the subject of a mathematical equation.
          - ref: "4.3.2.4"
            higher: >-
              In a chemical reaction involving two reactants, it is common to use an excess of one
              of the reactants to ensure that all of the other reactant is used. The reactant that
              is completely used up is called the limiting reactant because it limits the amount
              of products. Students should be able to explain the effect of a limiting quantity of
              a reactant on the amount of products it is possible to obtain in terms of amounts in
              moles or masses in grams.
          - ref: "4.3.2.5"
            foundation: >-
              Many chemical reactions take place in solutions. The concentration of a solution can
              be measured in mass per given volume of solution, eg grams per dm³ (g/dm³ ).
              Students should be able to: • calculate the mass of solute in a given volume of
              solution of known concentration in terms of mass per given volume of solution
            higher: >-
              Many chemical reactions take place in solutions. The concentration of a solution can
              be measured in mass per given volume of solution, eg grams per dm³ (g/dm³ ).
              Students should be able to: • calculate the mass of solute in a given volume of
              solution of known concentration in terms of mass per given volume of solution • (HT
              only) explain how the mass of a solute and the volume of a solution is related to
              the concentration of the solution.
      - title: Yield and atom economy of chemical reactions (chemistry only)
        objectives:
          - ref: "4.3.3.1"
            foundation: >-
              Even though no atoms are gained or lost in a chemical reaction, it is not always
              possible to obtain the calculated amount of a product because: • the reaction may
              not go to completion because it is reversible • some of the product may be lost when
              it is separated from the reaction mixture • some of the reactants may react in ways
              different to the expected reaction. The amount of a product obtained is known as the
              yield. When compared with the maximum theoretical amount as a percentage, it is
              called the percentage yield. % Yield = $\frac{\text{Mass of product actually
              made}}{\text{Maximum theoretical mass of product}}$ × 100 Students should be able
              to: • calculate the percentage yield of a product from the actual yield of a
              reaction
            higher: >-
              Even though no atoms are gained or lost in a chemical reaction, it is not always
              possible to obtain the calculated amount of a product because: • the reaction may
              not go to completion because it is reversible • some of the product may be lost when
              it is separated from the reaction mixture • some of the reactants may react in ways
              different to the expected reaction. The amount of a product obtained is known as the
              yield. When compared with the maximum theoretical amount as a percentage, it is
              called the percentage yield. % Yield = $\frac{\text{Mass of product actually
              made}}{\text{Maximum theoretical mass of product}}$ × 100 Students should be able
              to: • calculate the percentage yield of a product from the actual yield of a
              reaction • (HT only) calculate the theoretical mass of a product from a given mass
              of reactant and the balanced equation for the reaction.
          - ref: "4.3.3.2"
            foundation: >-
              The atom economy (atom utilisation) is a measure of the amount of starting materials
              that end up as useful products. It is important for sustainable development and for
              economic reasons to use reactions with high atom economy. The percentage atom
              economy of a reaction is calculated using the balanced equation for the reaction as
              follows: $\frac{\text{Relative formula mass of desired product from
              equation}}{\text{Sum of relative formula masses of all reactants from equation}}$ ×
              100 Students should be able to: • calculate the atom economy of a reaction to form a
              desired product from the balanced equation
            higher: >-
              The atom economy (atom utilisation) is a measure of the amount of starting materials
              that end up as useful products. It is important for sustainable development and for
              economic reasons to use reactions with high atom economy. The percentage atom
              economy of a reaction is calculated using the balanced equation for the reaction as
              follows: $\frac{\text{Relative formula mass of desired product from
              equation}}{\text{Sum of relative formula masses of all reactants from equation}}$ ×
              100 Students should be able to: • calculate the atom economy of a reaction to form a
              desired product from the balanced equation • (HT only) explain why a particular
              reaction pathway is chosen to produce a specified product given appropriate data
              such as atom economy (if not calculated), yield, rate, equilibrium position and
              usefulness of by-products.
      - title: Using concentrations of solutions in mol/dm³ (chemistry only)
        objectives:
          - ref: "4.3.4"
            foundation: >-
              The concentration of a solution can be measured in mol/dm³ . The amount in moles of
              solute or the mass in grams of solute in a given volume of solution can be
              calculated from its concentration in mol/dm³ . If the volumes of two solutions that
              react completely are known and the concentration of one solution is known, the
              concentration of the other solution can be calculated. Students should be able to
              explain how the concentration of a solution in mol/dm³ is related to the mass of the
              solute and the volume of the solution.
      - title: Use of amount of substance in relation to volumes of gases
        objectives:
          - ref: "4.3.5"
            foundation: >-
              Equal amounts in moles of gases occupy the same volume under the same conditions of
              temperature and pressure. The volume of one mole of any gas at room temperature and
              pressure (20oC and 1 atmosphere pressure) is 24 dm³ . The volumes of gaseous
              reactants and products can be calculated from the balanced equation for the
              reaction. Students should be able to: • calculate the volume of a gas at room
              temperature and pressure from its mass and relative formula mass • calculate volumes
              of gaseous reactants and products from a balanced equation and a given volume of a
              gaseous reactant or product • change the subject of a mathematical equation.
  - ref: "4.4"
    title: Chemical changes
    subtopics:
      - title: Reactivity of metals
        objectives:
          - ref: "4.4.1.1"
            foundation: >-
              Metals react with oxygen to produce metal oxides. The reactions are oxidation
              reactions because the metals gain oxygen. Students should be able to explain
              reduction and oxidation in terms of loss or gain of oxygen.
          - ref: "4.4.1.2"
            foundation: >-
              When metals react with other substances the metal atoms form positive ions. The
              reactivity of a metal is related to its tendency to form positive ions. Metals can
              be arranged in order of their reactivity in a reactivity series. The metals
              potassium, sodium, lithium, calcium, magnesium, zinc, iron and copper can be put in
              order of their reactivity from their reactions with water and dilute acids. The
              non-metals hydrogen and carbon are often included in the reactivity series. A more
              reactive metal can displace a less reactive metal from a compound. Students should
              be able to: • recall and describe the reactions, if any, of potassium, sodium,
              lithium, calcium, magnesium, zinc, iron and copper with water or dilute acids and
              where appropriate, to place these metals in order of reactivity • explain how the
              reactivity of metals with water or dilute acids is related to the tendency of the
              metal to form its positive ion • deduce an order of reactivity of metals based on
              experimental results. The reactions of metals with water and acids are limited to
              room temperature and do not include reactions with steam.
          - ref: "4.4.1.3"
            foundation: >-
              Unreactive metals such as gold are found in the Earth as the metal itself but most
              metals are found as compounds that require chemical reactions to extract the metal.
              Metals less reactive than carbon can be extracted from their oxides by reduction
              with carbon. Reduction involves the loss of oxygen. Knowledge and understanding are
              limited to the reduction of oxides using carbon. Knowledge of the details of
              processes used in the extraction of metals is not required. Students should be able
              to: • interpret or evaluate specific metal extraction processes when given
              appropriate information • identify the substances which are oxidised or reduced in
              terms of gain or loss of oxygen.
          - ref: "4.4.1.4"
            higher: >-
              Oxidation is the loss of electrons and reduction is the gain of electrons. Student
              should be able to: • write ionic equations for displacement reactions • identify in
              a given reaction, symbol equation or half equation which species are oxidised and
              which are reduced.
      - title: Reactions of acids
        objectives:
          - ref: "4.4.2.1"
            foundation: >-
              Acids react with some metals to produce salts and hydrogen. Knowledge of reactions
              limited to those of magnesium, zinc and iron with hydrochloric and sulfuric acids.
            higher: >-
              Acids react with some metals to produce salts and hydrogen. (HT only) Students
              should be able to: • explain in terms of gain or loss of electrons, that these are
              redox reactions • identify which species are oxidised and which are reduced in given
              chemical equations. Knowledge of reactions limited to those of magnesium, zinc and
              iron with hydrochloric and sulfuric acids.
          - ref: "4.4.2.2"
            foundation: >-
              Acids are neutralised by alkalis (eg soluble metal hydroxides) and bases (eg
              insoluble metal hydroxides and metal oxides) to produce salts and water, and by
              metal carbonates to produce salts, water and carbon dioxide. The particular salt
              produced in any reaction between an acid and a base or alkali depends on: • the acid
              used (hydrochloric acid produces chlorides, nitric acid produces nitrates, sulfuric
              acid produces sulfates) • the positive ions in the base, alkali or carbonate.
              Students should be able to: • predict products from given reactants • use the
              formulae of common ions to deduce the formulae of salts.
          - ref: "4.4.2.3"
            foundation: >-
              Soluble salts can be made from acids by reacting them with solid insoluble
              substances, such as metals, metal oxides, hydroxides or carbonates. The solid is
              added to the acid until no more reacts and the excess solid is filtered off to
              produce a solution of the salt. Salt solutions can be crystallised to produce solid
              salts. Students should be able to describe how to make pure, dry samples of named
              soluble salts from information provided. Required practical 1: preparation of a
              pure, dry sample of a soluble salt from an insoluble oxide or carbonate using a
              Bunsen burner to heat dilute acid and a water bath or electric heater to evaporate
              the solution.
          - ref: "4.4.2.4"
            foundation: >-
              Acids produce hydrogen ions (H⁺ ) in aqueous solutions. Aqueous solutions of alkalis
              contain hydroxide ions (OH⁻ ). The pH scale, from 0 to 14, is a measure of the
              acidity or alkalinity of a solution, and can be measured using universal indicator
              or a pH probe. A solution with pH 7 is neutral. Aqueous solutions of acids have pH
              values of less than 7 and aqueous solutions of alkalis have pH values greater than
              7. In neutralisation reactions between an acid and an alkali, hydrogen ions react
              with hydroxide ions to produce water. This reaction can be represented by the
              equation: Students should be able to: • describe the use of universal indicator or a
              wide range indicator to measure the approximate pH of a solution • use the pH scale
              to identify acidic or alkaline solutions.
          - ref: "4.4.2.5"
            foundation: >-
              The volumes of acid and alkali solutions that react with each other can be measured
              by titration using a suitable indicator. Students should be able to: • describe how
              to carry out titrations using strong acids and strong alkalis only (sulfuric,
              hydrochloric and nitric acids only) to find the reacting volumes accurately • (HT
              Only) calculate the chemical quantities in titrations involving concentrations in
              mol/dm³ and in g/dm³ . Required practical 2: (chemistry only) determination of the
              reacting volumes of solutions of a strong acid and a strong alkali by titration.
            higher: >-
              The volumes of acid and alkali solutions that react with each other can be measured
              by titration using a suitable indicator. Students should be able to: • describe how
              to carry out titrations using strong acids and strong alkalis only (sulfuric,
              hydrochloric and nitric acids only) to find the reacting volumes accurately • (HT
              Only) calculate the chemical quantities in titrations involving concentrations in
              mol/dm³ and in g/dm³ . Required practical 2: (chemistry only) determination of the
              reacting volumes of solutions of a strong acid and a strong alkali by titration. (HT
              only) determination of the concentration of one of the solutions in mol/dm³ and
              g/dm³ from the reacting volumes and the known concentration of the other solution.
          - ref: "4.4.2.6"
            higher: >-
              A strong acid is completely ionised in aqueous solution. Examples of strong acids
              are hydrochloric, nitric and sulfuric acids. A weak acid is only partially ionised
              in aqueous solution. Examples of weak acids are ethanoic, citric and carbonic acids.
              For a given concentration of aqueous solutions, the stronger an acid, the lower the
              pH. As the pH decreases by one unit, the hydrogen ion concentration of the solution
              increases by a factor of 10. Students should be able to: • use and explain the terms
              dilute and concentrated (in terms of amount of substance), and weak and strong (in
              terms of the degree of ionisation) in relation to acids • describe neutrality and
              relative acidity in terms of the effect on hydrogen ion concentration and the
              numerical value of pH (whole numbers only).
      - title: Electrolysis
        objectives:
          - ref: "4.4.3.1"
            foundation: >-
              When an ionic compound is melted or dissolved in water, the ions are free to move
              about within the liquid or solution. These liquids and solutions are able to conduct
              electricity and are called electrolytes. Passing an electric current through
              electrolytes causes the ions to move to the electrodes. Positively charged ions move
              to the negative electrode (the cathode), and negatively charged ions move to the
              positive electrode (the anode). Ions are discharged at the electrodes producing
              elements. This process is called electrolysis.
            higher: >-
              When an ionic compound is melted or dissolved in water, the ions are free to move
              about within the liquid or solution. These liquids and solutions are able to conduct
              electricity and are called electrolytes. Passing an electric current through
              electrolytes causes the ions to move to the electrodes. Positively charged ions move
              to the negative electrode (the cathode), and negatively charged ions move to the
              positive electrode (the anode). Ions are discharged at the electrodes producing
              elements. This process is called electrolysis. (HT only) Throughout Section 4.4.3
              Higher Tier students should be able to write half equations for the reactions
              occurring at the electrodes during electrolysis, and may be required to complete and
              balance supplied half equations.
          - ref: "4.4.3.2"
            foundation: >-
              When a simple ionic compound (eg lead bromide) is electrolysed in the molten state
              using inert electrodes, the metal (lead) is produced at the cathode and the
              non-metal (bromine) is produced at the anode. Students should be able to predict the
              products of the electrolysis of binary ionic compounds in the molten state.
          - ref: "4.4.3.3"
            foundation: >-
              Metals can be extracted from molten compounds using electrolysis. Electrolysis is
              used if the metal is too reactive to be extracted by reduction with carbon or if the
              metal reacts with carbon. Large amounts of energy are used in the extraction process
              to melt the compounds and to produce the electrical current. Aluminium is
              manufactured by the electrolysis of a molten mixture of aluminium oxide and cryolite
              using carbon as the positive electrode (anode). Students should be able to: •
              explain why a mixture is used as the electrolyte • explain why the positive
              electrode must be continually replaced.
          - ref: "4.4.3.4"
            foundation: >-
              The ions discharged when an aqueous solution is electrolysed using inert electrodes
              depend on the relative reactivity of the elements involved. At the negative
              electrode (cathode), hydrogen is produced if the metal is more reactive than
              hydrogen. At the positive electrode (anode), oxygen is produced unless the solution
              contains halide ions when the halogen is produced. This happens because in the
              aqueous solution water molecules break down producing hydrogen ions and hydroxide
              ions that are discharged. Students should be able to predict the products of the
              electrolysis of aqueous solutions containing a single ionic compound. Required
              practical 3: investigate what happens when aqueous solutions are electrolysed using
              inert electrodes. This should be an investigation involving developing a hypothesis.
          - ref: "4.4.3.5"
            higher: >-
              During electrolysis, at the cathode (negative electrode), positively charged ions
              gain electrons and so the reactions are reductions. At the anode (positive
              electrode), negatively charged ions lose electrons and so the reactions are
              oxidations. Reactions at electrodes can be represented by half equations, for
              example: 2H⁺ + 2e⁻ → H₂ and 4OH⁻ → O₂ + 2H₂O + 4e⁻ or 4OH⁻ – 4e⁻ → O₂ + 2H₂O
  - ref: "4.5"
    title: Energy changes
    subtopics:
      - title: Exothermic and endothermic reactions
        objectives:
          - ref: "4.5.1.1"
            foundation: >-
              Energy is conserved in chemical reactions. The amount of energy in the universe at
              the end of a chemical reaction is the same as before the reaction takes place. If a
              reaction transfers energy to the surroundings the product molecules must have less
              energy than the reactants, by the amount transferred. An exothermic reaction is one
              that transfers energy to the surroundings so the temperature of the surroundings
              increases. Exothermic reactions include combustion, many oxidation reactions and
              neutralisation. Everyday uses of exothermic reactions include self-heating cans and
              hand warmers. An endothermic reaction is one that takes in energy from the
              surroundings so the temperature of the surroundings decreases. Endothermic reactions
              include thermal decompositions and the reaction of citric acid and sodium
              hydrogencarbonate. Some sports injury packs are based on endothermic reactions.
              Students should be able to: • distinguish between exothermic and endothermic
              reactions on the basis of the temperature change of the surroundings • evaluate uses
              and applications of exothermic and endothermic reactions given appropriate
              information. Limited to measurement of temperature change. Calculation of energy
              changes or ΔH is not required. Required practical 4: investigate the variables that
              affect temperature changes in reacting solutions such as, eg acid plus metals, acid
              plus carbonates, neutralisations, displacement of metals.
          - ref: "4.5.1.2"
            foundation: >-
              Chemical reactions can occur only when reacting particles collide with each other
              and with sufficient energy. The minimum amount of energy that particles must have to
              react is called the activation energy. Reaction profiles can be used to show the
              relative energies of reactants and products, the activation energy and the overall
              energy change of a reaction. Students should be able to: • draw simple reaction
              profiles (energy level diagrams) for exothermic and endothermic reactions showing
              the relative energies of reactants and products, the activation energy and the
              overall energy change, with a curved line to show the energy as the reaction
              proceeds • use reaction profiles to identify reactions as exothermic or endothermic
              • explain that the activation energy is the energy needed for a reaction to occur.
          - ref: "4.5.1.3"
            higher: >-
              During a chemical reaction: • energy must be supplied to break bonds in the
              reactants • energy is released when bonds in the products are formed. The energy
              needed to break bonds and the energy released when bonds are formed can be
              calculated from bond energies. The difference between the sum of the energy needed
              to break bonds in the reactants and the sum of the energy released when bonds in the
              products are formed is the overall energy change of the reaction. In an exothermic
              reaction, the energy released from forming new bonds is greater than the energy
              needed to break existing bonds. In an endothermic reaction, the energy needed to
              break existing bonds is greater than the energy released from forming new bonds.
              Students should be able to calculate the energy transferred in chemical reactions
              using bond energies supplied.
      - title: Chemical cells and fuel cells (chemistry only)
        objectives:
          - ref: "4.5.2.1"
            foundation: >-
              Cells contain chemicals which react to produce electricity. The voltage produced by
              a cell is dependent upon a number of factors including the type of electrode and
              electrolyte. A simple cell can be made by connecting two different metals in contact
              with an electrolyte. Batteries consist of two or more cells connected together in
              series to provide a greater voltage. In non-rechargeable cells and batteries the
              chemical reactions stop when one of the reactants has been used up. Alkaline
              batteries are non-rechargeable. Rechargeable cells and batteries can be recharged
              because the chemical reactions are reversed when an external electrical current is
              supplied. Students should be able to interpret data for relative reactivity of
              different metals and evaluate the use of cells. Students do not need to know details
              of cells and batteries other than those specified.
          - ref: "4.5.2.2"
            foundation: >-
              Fuel cells are supplied by an external source of fuel (eg hydrogen) and oxygen or
              air. The fuel is oxidised electrochemically within the fuel cell to produce a
              potential difference. The overall reaction in a hydrogen fuel cell involves the
              oxidation of hydrogen to produce water. Hydrogen fuel cells offer a potential
              alternative to rechargeable cells and batteries. Students should be able to: •
              evaluate the use of hydrogen fuel cells in comparison with rechargeable cells and
              batteries
            higher: >-
              Fuel cells are supplied by an external source of fuel (eg hydrogen) and oxygen or
              air. The fuel is oxidised electrochemically within the fuel cell to produce a
              potential difference. The overall reaction in a hydrogen fuel cell involves the
              oxidation of hydrogen to produce water. Hydrogen fuel cells offer a potential
              alternative to rechargeable cells and batteries. Students should be able to: •
              evaluate the use of hydrogen fuel cells in comparison with rechargeable cells and
              batteries • (HT only) write the half equations for the electrode reactions in the
              hydrogen fuel cell.
  - ref: "4.6"
    title: The rate and extent of chemical change
    subtopics:
      - title: Rate of reaction
        objectives:
          - ref: "4.6.1.1"
            foundation: >-
              The rate of a chemical reaction can be found by measuring the quantity of a reactant
              used or the quantity of product formed over time: mean rate of reaction =
              $\frac{\text{quantity of reactant used}}{\text{time taken}}$ mean rate of reaction =
              $\frac{\text{quantity of product formed}}{\text{time taken}}$ The quantity of
              reactant or product can be measured by the mass in grams or by a volume in cm³ . The
              units of rate of reaction may be given as g/s or cm³ /s. For the Higher Tier,
              students are also required to use quantity of reactants in terms of moles and units
              for rate of reaction in mol/s. Students should be able to: • calculate the mean rate
              of a reaction from given information about the quantity of a reactant used or the
              quantity of a product formed and the time taken • draw, and interpret, graphs
              showing the quantity of product formed or quantity of reactant used up against time
              • draw tangents to the curves on these graphs and use the slope of the tangent as a
              measure of the rate of reaction
            higher: >-
              The rate of a chemical reaction can be found by measuring the quantity of a reactant
              used or the quantity of product formed over time: mean rate of reaction =
              $\frac{\text{quantity of reactant used}}{\text{time taken}}$ mean rate of reaction =
              $\frac{\text{quantity of product formed}}{\text{time taken}}$ The quantity of
              reactant or product can be measured by the mass in grams or by a volume in cm³ . The
              units of rate of reaction may be given as g/s or cm³ /s. For the Higher Tier,
              students are also required to use quantity of reactants in terms of moles and units
              for rate of reaction in mol/s. Students should be able to: • calculate the mean rate
              of a reaction from given information about the quantity of a reactant used or the
              quantity of a product formed and the time taken • draw, and interpret, graphs
              showing the quantity of product formed or quantity of reactant used up against time
              • draw tangents to the curves on these graphs and use the slope of the tangent as a
              measure of the rate of reaction • (HT only) calculate the gradient of a tangent to
              the curve on these graphs as a measure of rate of reaction at a specific time.
          - ref: "4.6.1.2"
            foundation: >-
              Factors which affect the rates of chemical reactions include: the concentrations of
              reactants in solution, the pressure of reacting gases, the surface area of solid
              reactants, the temperature and the presence of catalysts. Students should be able to
              recall how changing these factors affects the rate of chemical reactions. Required
              practical 5: investigate how changes in concentration affect the rates of reactions
              by a method involving measuring the volume of a gas produced and a method involving
              a change in colour or turbidity. This should be an investigation involving
              developing a hypothesis.
          - ref: "4.6.1.3"
            foundation: >-
              Collision theory explains how various factors affect rates of reactions. According
              to this theory, chemical reactions can occur only when reacting particles collide
              with each other and with sufficient energy. The minimum amount of energy that
              particles must have to react is called the activation energy. Increasing the
              concentration of reactants in solution, the pressure of reacting gases, and the
              surface area of solid reactants increases the frequency of collisions and so
              increases the rate of reaction. Increasing the temperature increases the frequency
              of collisions and makes the collisions more energetic, and so increases the rate of
              reaction. Students should be able to : • predict and explain using collision theory
              the effects of changing conditions of concentration, pressure and temperature on the
              rate of a reaction • predict and explain the effects of changes in the size of
              pieces of a reacting solid in terms of surface area to volume ratio • use simple
              ideas about proportionality when using collision theory to explain the effect of a
              factor on the rate of a reaction.
          - ref: "4.6.1.4"
            foundation: >-
              Catalysts change the rate of chemical reactions but are not used up during the
              reaction. Different reactions need different catalysts. Enzymes act as catalysts in
              biological systems. Catalysts increase the rate of reaction by providing a different
              pathway for the reaction that has a lower activation energy. A reaction profile for
              a catalysed reaction can be drawn in the following form: Students should be able to
              identify catalysts in reactions from their effect on the rate of reaction and
              because they are not included in the chemical equation for the reaction. Students
              should be able to explain catalytic action in terms of activation energy. Students
              do not need to know the names of catalysts other than those specified in the subject
              content.
      - title: Reversible reactions and dynamic equilibrium
        objectives:
          - ref: "4.6.2.1"
            foundation: >-
              In some chemical reactions, the products of the reaction can react to produce the
              original reactants. Such reactions are called reversible reactions and are
              represented: A + B C + D The direction of reversible reactions can be changed by
              changing the conditions. For example:
          - ref: "4.6.2.2"
            foundation: >-
              If a reversible reaction is exothermic in one direction, it is endothermic in the
              opposite direction. The same amount of energy is transferred in each case. For
              example:
          - ref: "4.6.2.3"
            foundation: >-
              When a reversible reaction occurs in apparatus which prevents the escape of
              reactants and products, equilibrium is reached when the forward and reverse
              reactions occur at exactly the same rate.
          - ref: "4.6.2.4"
            higher: >-
              The relative amounts of all the reactants and products at equilibrium depend on the
              conditions of the reaction. If a system is at equilibrium and a change is made to
              any of the conditions, then the system responds to counteract the change. The
              effects of changing conditions on a system at equilibrium can be predicted using Le
              Chatelier’s Principle. Students should be able to make qualitative predictions about
              the effect of changes on systems at equilibrium when given appropriate information.
          - ref: "4.6.2.5"
            higher: >-
              If the concentration of one of the reactants or products is changed, the system is
              no longer at equilibrium and the concentrations of all the substances will change
              until equilibrium is reached again. If the concentration of a reactant is increased,
              more products will be formed until equilibrium is reached again. If the
              concentration of a product is decreased, more reactants will react until equilibrium
              is reached again. Students should be able to interpret appropriate given data to
              predict the effect of a change in concentration of a reactant or product on given
              reactions at equilibrium.
          - ref: "4.6.2.6"
            higher: >-
              If the temperature of a system at equilibrium is increased: • the relative amount of
              products at equilibrium increases for an endothermic reaction • the relative amount
              of products at equilibrium decreases for an exothermic reaction. If the temperature
              of a system at equilibrium is decreased: • the relative amount of products at
              equilibrium decreases for an endothermic reaction • the relative amount of products
              at equilibrium increases for an exothermic reaction. Students should be able to
              interpret appropriate given data to predict the effect of a change in temperature on
              given reactions at equilibrium.
          - ref: "4.6.2.7"
            higher: >-
              For gaseous reactions at equilibrium: • an increase in pressure causes the
              equilibrium position to shift towards the side with the smaller number of molecules
              as shown by the symbol equation for that reaction • a decrease in pressure causes
              the equilibrium position to shift towards the side with the larger number of
              molecules as shown by the symbol equation for that reaction. Students should be able
              to interpret appropriate given data to predict the effect of pressure changes on
              given reactions at equilibrium.
  - ref: "4.7"
    title: Organic chemistry
    subtopics:
      - title: Carbon compounds as fuels and feedstock
        objectives:
          - ref: "4.7.1.1"
            foundation: >-
              Crude oil is a finite resource found in rocks. Crude oil is the remains of an
              ancient biomass consisting mainly of plankton that was buried in mud. Crude oil is a
              mixture of a very large number of compounds. Most of the compounds in crude oil are
              hydrocarbons, which are molecules made up of hydrogen and carbon atoms only. Most of
              the hydrocarbons in crude oil are hydrocarbons called alkanes. The general formula
              for the homologous series of alkanes is CnH₂n₊₂ The first four members of the
              alkanes are methane, ethane, propane and butane. Alkane molecules can be represented
              in the following forms: C₂H₆ or Students should be able to recognise substances as
              alkanes given their formulae in these forms. Students do not need to know the names
              of specific alkanes other than methane, ethane, propane and butane.
          - ref: "4.7.1.2"
            foundation: >-
              The many hydrocarbons in crude oil may be separated into fractions, each of which
              contains molecules with a similar number of carbon atoms, by fractional
              distillation. The fractions can be processed to produce fuels and feedstock for the
              petrochemical industry. Many of the fuels on which we depend for our modern
              lifestyle, such as petrol, diesel oil, kerosene, heavy fuel oil and liquefied
              petroleum gases, are produced from crude oil. Many useful materials on which modern
              life depends are produced by the petrochemical industry, such as solvents,
              lubricants, polymers, detergents. The vast array of natural and synthetic carbon
              compounds occur due to the ability of carbon atoms to form families of similar
              compounds. Students should be able to explain how fractional distillation works in
              terms of evaporation and condensation. Knowledge of the names of other specific
              fractions or fuels is not required.
          - ref: "4.7.1.3"
            foundation: >-
              Some properties of hydrocarbons depend on the size of their molecules, including
              boiling point, viscosity and flammability. These properties influence how
              hydrocarbons are used as fuels. Students should be able to recall how boiling point,
              viscosity and flammability change with increasing molecular size. The combustion of
              hydrocarbon fuels releases energy. During combustion, the carbon and hydrogen in the
              fuels are oxidised. The complete combustion of a hydrocarbon produces carbon dioxide
              and water. Students should be able to write balanced equations for the complete
              combustion of hydrocarbons with a given formula. Knowledge of trends in properties
              of hydrocarbons is limited to: • boiling points • viscosity • flammability.
          - ref: "4.7.1.4"
            foundation: >-
              Hydrocarbons can be broken down (cracked) to produce smaller, more useful molecules.
              Cracking can be done by various methods including catalytic cracking and steam
              cracking. Students should be able to describe in general terms the conditions used
              for catalytic cracking and steam cracking. The products of cracking include alkanes
              and another type of hydrocarbon called alkenes. Alkenes are more reactive than
              alkanes and react with bromine water, which is used as a test for alkenes. Students
              should be able to recall the colour change when bromine water reacts with an alkene.
              There is a high demand for fuels with small molecules and so some of the products of
              cracking are useful as fuels. Alkenes are used to produce polymers and as starting
              materials for the production of many other chemicals. Students should be able to
              balance chemical equations as examples of cracking given the formulae of the
              reactants and products. Students should be able to give examples to illustrate the
              usefulness of cracking. They should also be able to explain how modern life depends
              on the uses of hydrocarbons. (For Combined Science: Trilogy and Synergy students do
              not need to know the formulae or names of individual alkenes.)
      - title: Reactions of alkenes and alcohols (chemistry only)
        objectives:
          - ref: "4.7.2.1"
            foundation: >-
              Alkenes are hydrocarbons with a double carbon-carbon bond. The general formula for
              the homologous series of alkenes is CnH₂n Alkene molecules are unsaturated because
              they contain two fewer hydrogen atoms than the alkane with the same number of carbon
              atoms. The first four members of the homologous series of alkenes are ethene,
              propene, butene and pentene. Alkene molecules can be represented in the following
              forms: C₃H₆ or Students do not need to know the names of individual alkenes other
              than ethene, propene, butene and pentene.
          - ref: "4.7.2.2"
            foundation: >-
              Alkenes are hydrocarbons with the functional group C=C. It is the generality of
              reactions of functional groups that determine the reactions of organic compounds.
              Alkenes react with oxygen in combustion reactions in the same way as other
              hydrocarbons, but they tend to burn in air with smoky flames because of incomplete
              combustion. Alkenes react with hydrogen, water and the halogens, by the addition of
              atoms across the carbon-carbon double bond so that the double bond becomes a single
              carbon-carbon bond. Students should be able to: • describe the reactions and
              conditions for the addition of hydrogen, water and halogens to alkenes • draw fully
              displayed structural formulae of the first four members of the alkenes and the
              products of their addition reactions with hydrogen, water, chlorine, bromine and
              iodine.
          - ref: "4.7.2.3"
            foundation: >-
              Alcohols contain the functional group –OH. Methanol, ethanol, propanol and butanol
              are the first four members of a homologous series of alcohols. Alcohols can be
              represented in the following forms: CH₃CH₂OH or Students should be able to: •
              describe what happens when any of the first four alcohols react with sodium, burn in
              air, are added to water, react with an oxidising agent • recall the main uses of
              these alcohols. Aqueous solutions of ethanol are produced when sugar solutions are
              fermented using yeast. Students should know the conditions used for fermentation of
              sugar using yeast. Students should be able to recognise alcohols from their names or
              from given formulae. Students do not need to know the names of individual alcohols
              other than methanol, ethanol, propanol and butanol. Students are not expected to
              write balanced chemical equations for the reactions of alcohols other than for
              combustion reactions.
          - ref: "4.7.2.4"
            foundation: >-
              Carboxylic acids have the functional group –COOH. The first four members of a
              homologous series of carboxylic acids are methanoic acid, ethanoic acid, propanoic
              acid and butanoic acid. The structures of carboxylic acids can be represented in the
              following forms: CH₃COOH or Students should be able to: • describe what happens when
              any of the first four carboxylic acids react with carbonates, dissolve in water,
              react with alcohols Students should be able to recognise carboxylic acids from their
              names or from given formulae. Students do not need to know the names of individual
              carboxylic acids other than methanoic acid, ethanoic acid, propanoic acid and
              butanoic acid. Students are not expected to write balanced chemical equations for
              the reactions of carboxylic acids. Students do not need to know the names of esters
              other than ethyl ethanoate.
            higher: >-
              Carboxylic acids have the functional group –COOH. The first four members of a
              homologous series of carboxylic acids are methanoic acid, ethanoic acid, propanoic
              acid and butanoic acid. The structures of carboxylic acids can be represented in the
              following forms: CH₃COOH or Students should be able to: • describe what happens when
              any of the first four carboxylic acids react with carbonates, dissolve in water,
              react with alcohols • (HT only) explain why carboxylic acids are weak acids in terms
              of ionisation and pH (see Strong and weak acids (HT only) (page 48)). Students
              should be able to recognise carboxylic acids from their names or from given
              formulae. Students do not need to know the names of individual carboxylic acids
              other than methanoic acid, ethanoic acid, propanoic acid and butanoic acid. Students
              are not expected to write balanced chemical equations for the reactions of
              carboxylic acids. Students do not need to know the names of esters other than ethyl
              ethanoate.
      - title: Synthetic and naturally occurring polymers (chemistry only)
        objectives:
          - ref: "4.7.3.1"
            foundation: >-
              Alkenes can be used to make polymers such as poly(ethene) and poly(propene) by
              addition polymerisation. In addition polymerisation reactions, many small molecules
              (monomers) join together to form very large molecules (polymers). For example: In
              addition polymers the repeating unit has the same atoms as the monomer because no
              other molecule is formed in the reaction. Students should be able to: • recognise
              addition polymers and monomers from diagrams in the forms shown and from the
              presence of the functional group C=C in the monomers • draw diagrams to represent
              the formation of a polymer from a given alkene monomer • relate the repeating unit
              to the monomer.
          - ref: "4.7.3.2"
            higher: >-
              Condensation polymerisation involves monomers with two functional groups. When these
              types of monomers react they join together, usually losing small molecules such as
              water, and so the reactions are called condensation reactions. The simplest polymers
              are produced from two different monomers with two of the same functional groups on
              each monomer. For example: ethanediol and hexanedioic acid polymerise to produce a
              polyester: Students should be able to explain the basic principles of condensation
              polymerisation by reference to the functional groups in the monomers and the
              repeating units in the polymers.
          - ref: "4.7.3.3"
            higher: >-
              Amino acids have two different functional groups in a molecule. Amino acids react by
              condensation polymerisation to produce polypeptides. For example: glycine is
              H₂NCH₂COOH and polymerises to produce the polypeptide Different amino acids can be
              combined in the same chain to produce proteins.
          - ref: "4.7.3.4"
            foundation: >-
              DNA (deoxyribonucleic acid) is a large molecule essential for life. DNA encodes
              genetic instructions for the development and functioning of living organisms and
              viruses. Most DNA molecules are two polymer chains, made from four different
              monomers called nucleotides, in the form of a double helix. Other naturally
              occurring polymers important for life include proteins, starch and cellulose.
              Students should be able to name the types of monomers from which these naturally
              occurring polymers are made.
  - ref: "4.8"
    title: Chemical analysis
    subtopics:
      - title: Purity, formulations and chromatography
        objectives:
          - ref: "4.8.1.1"
            foundation: >-
              In chemistry, a pure substance is a single element or compound, not mixed with any
              other substance. Pure elements and compounds melt and boil at specific temperatures.
              Melting point and boiling point data can be used to distinguish pure substances from
              mixtures. In everyday language, a pure substance can mean a substance that has had
              nothing added to it, so it is unadulterated and in its natural state, eg pure milk.
              Students should be able to use melting point and boiling point data to distinguish
              pure from impure substances.
          - ref: "4.8.1.2"
            foundation: >-
              A formulation is a mixture that has been designed as a useful product. Many products
              are complex mixtures in which each chemical has a particular purpose. Formulations
              are made by mixing the components in carefully measured quantities to ensure that
              the product has the required properties. Formulations include fuels, cleaning
              agents, paints, medicines, alloys, fertilisers and foods. Students should be able to
              identify formulations given appropriate information. Students do not need to know
              the names of components in proprietary products.
          - ref: "4.8.1.3"
            foundation: >-
              Chromatography can be used to separate mixtures and can give information to help
              identify substances. Chromatography involves a stationary phase and a mobile phase.
              Separation depends on the distribution of substances between the phases. The ratio
              of the distance moved by a compound (centre of spot from origin) to the distance
              moved by the solvent can be expressed as its Rf value: $R_f = \frac{\text{distance
              moved by substance}}{\text{distance moved by solvent}}$ Different compounds have
              different Rf values in different solvents, which can be used to help identify the
              compounds. The compounds in a mixture may separate into different spots depending on
              the solvent but a pure compound will produce a single spot in all solvents. Students
              should be able to: • explain how paper chromatography separates mixtures • suggest
              how chromatographic methods can be used for distinguishing pure substances from
              impure substances • interpret chromatograms and determine Rf values from
              chromatograms • provide answers to an appropriate number of significant figures.
              Required practical 6: investigate how paper chromatography can be used to separate
              and tell the difference between coloured substances. Students should calculate Rf
              values.
      - title: Identification of common gases
        objectives:
          - ref: "4.8.2.1"
            foundation: >-
              The test for hydrogen uses a burning splint held at the open end of a test tube of
              the gas. Hydrogen burns rapidly with a pop sound.
          - ref: "4.8.2.2"
            foundation: >-
              The test for oxygen uses a glowing splint inserted into a test tube of the gas. The
              splint relights in oxygen.
          - ref: "4.8.2.3"
            foundation: >-
              The test for carbon dioxide uses an aqueous solution of calcium hydroxide (lime
              water). When carbon dioxide is shaken with or bubbled through limewater the
              limewater turns milky (cloudy).
          - ref: "4.8.2.4"
            foundation: >-
              The test for chlorine uses litmus paper. When damp litmus paper is put into chlorine
              gas the litmus paper is bleached and turns white.
      - title: Identification of ions by chemical and spectroscopic means
        objectives:
          - ref: "4.8.3.1"
            foundation: >-
              Flame tests can be used to identify some metal ions (cations). Lithium, sodium,
              potassium, calcium and copper compounds produce distinctive colours in flame tests:
              • lithium compounds result in a crimson flame • sodium compounds result in a yellow
              flame • potassium compounds result in a lilac flame • calcium compounds result in an
              orange-red flame • copper compounds result in a green flame. If a sample containing
              a mixture of ions is used some flame colours can be masked. Students should be able
              to identify species from the results of the tests in 4.8.3.1 to 4.8.3.5. Flame
              colours of other metal ions are not required knowledge.
          - ref: "4.8.3.2"
            foundation: >-
              Sodium hydroxide solution can be used to identify some metal ions (cations).
              Solutions of aluminium, calcium and magnesium ions form white precipitates when
              sodium hydroxide solution is added but only the aluminium hydroxide precipitate
              dissolves in excess sodium hydroxide solution. Solutions of copper(II), iron(II) and
              iron(III) ions form coloured precipitates when sodium hydroxide solution is added.
              Copper(II) forms a blue precipitate, iron(II) a green precipitate and iron(III) a
              brown precipitate. Students should be able to write balanced equations for the
              reactions to produce the insoluble hydroxides. Students are not expected to write
              equations for the production of sodium aluminate.
          - ref: "4.8.3.3"
            foundation: >-
              Carbonates react with dilute acids to form carbon dioxide gas. Carbon dioxide can be
              identified with limewater.
          - ref: "4.8.3.4"
            foundation: >-
              Halide ions in solution produce precipitates with silver nitrate solution in the
              presence of dilute nitric acid. Silver chloride is white, silver bromide is cream
              and silver iodide is yellow.
          - ref: "4.8.3.5"
            foundation: >-
              Sulfate ions in solution produce a white precipitate with barium chloride solution
              in the presence of dilute hydrochloric acid. Required practical 7: use of chemical
              tests to identify the ions in unknown single ionic compounds covering the ions from
              sections Flame tests (page 73) to Sulfates (page 74).
          - ref: "4.8.3.6"
            foundation: >-
              Elements and compounds can be detected and identified using instrumental methods.
              Instrumental methods are accurate, sensitive and rapid. Students should be able to
              state advantages of instrumental methods compared with the chemical tests in this
              specification.
          - ref: "4.8.3.7"
            foundation: >-
              Flame emission spectroscopy is an example of an instrumental method used to analyse
              metal ions in solutions. The sample is put into a flame and the light given out is
              passed through a spectroscope. The output is a line spectrum that can be analysed to
              identify the metal ions in the solution and measure their concentrations. Students
              should be able to interpret an instrumental result given appropriate data in chart
              or tabular form, when accompanied by a reference set in the same form, limited to
              flame emission spectroscopy.
  - ref: "4.9"
    title: Chemistry of the atmosphere
    subtopics:
      - title: The composition and evolution of the Earth's atmosphere
        objectives:
          - ref: "4.9.1.1"
            foundation: >-
              For 200 million years, the proportions of different gases in the atmosphere have
              been much the same as they are today: • about four-fifths (approximately 80%)
              nitrogen • about one-fifth (approximately 20%) oxygen • small proportions of various
              other gases, including carbon dioxide, water vapour and noble gases.
          - ref: "4.9.1.2"
            foundation: >-
              Theories about what was in the Earth’s early atmosphere and how the atmosphere was
              formed have changed and developed over time. Evidence for the early atmosphere is
              limited because of the time scale of 4.6 billion years. One theory suggests that
              during the first billion years of the Earth’s existence there was intense volcanic
              activity that released gases that formed the early atmosphere and water vapour that
              condensed to form the oceans. At the start of this period the Earth’s atmosphere may
              have been like the atmospheres of Mars and Venus today, consisting of mainly carbon
              dioxide with little or no oxygen gas. Volcanoes also produced nitrogen which
              gradually built up in the atmosphere and there may have been small proportions of
              methane and ammonia. When the oceans formed carbon dioxide dissolved in the water
              and carbonates were precipitated producing sediments, reducing the amount of carbon
              dioxide in the atmosphere. No knowledge of other theories is required. Students
              should be able to, given appropriate information, interpret evidence and evaluate
              different theories about the Earth’s early atmosphere.
          - ref: "4.9.1.3"
            foundation: >-
              Algae and plants produced the oxygen that is now in the atmosphere by
              photosynthesis, which can be represented by the equation: Algae first produced
              oxygen about 2.7 billion years ago and soon after this oxygen appeared in the
              atmosphere. Over the next billion years plants evolved and the percentage of oxygen
              gradually increased to a level that enabled animals to evolve.
          - ref: "4.9.1.4"
            foundation: >-
              Algae and plants decreased the percentage of carbon dioxide in the atmosphere by
              photosynthesis. Carbon dioxide was also decreased by the formation of sedimentary
              rocks and fossil fuels that contain carbon. Students should be able to: • describe
              the main changes in the atmosphere over time and some of the likely causes of these
              changes • describe and explain the formation of deposits of limestone, coal, crude
              oil and natural gas.
      - title: Carbon dioxide and methane as greenhouse gases
        objectives:
          - ref: "4.9.2.1"
            foundation: >-
              Greenhouse gases in the atmosphere maintain temperatures on Earth high enough to
              support life. Water vapour, carbon dioxide and methane are greenhouse gases.
              Students should be able to describe the greenhouse effect in terms of the
              interaction of short and long wavelength radiation with matter.
          - ref: "4.9.2.2"
            foundation: >-
              Some human activities increase the amounts of greenhouse gases in the atmosphere.
              These include: • carbon dioxide • methane. Students should be able to recall two
              human activities that increase the amounts of each of the greenhouse gases carbon
              dioxide and methane. Based on peer-reviewed evidence, many scientists believe that
              human activities will cause the temperature of the Earth’s atmosphere to increase at
              the surface and that this will result in global climate change. However, it is
              difficult to model such complex systems as global climate change. This leads to
              simplified models, speculation and opinions presented in the media that may be based
              on only parts of the evidence and which may be biased. Students should be able to: •
              evaluate the quality of evidence in a report about global climate change given
              appropriate information • describe uncertainties in the evidence base • recognise
              the importance of peer review of results and of communicating results to a wide
              range of audiences.
          - ref: "4.9.2.3"
            foundation: >-
              An increase in average global temperature is a major cause of climate change. There
              are several potential effects of global climate change. Students should be able to:
              • describe briefly four potential effects of global climate change • discuss the
              scale, risk and environmental implications of global climate change.
          - ref: "4.9.2.4"
            foundation: >-
              The carbon footprint is the total amount of carbon dioxide and other greenhouse
              gases emitted over the full life cycle of a product, service or event. The carbon
              footprint can be reduced by reducing emissions of carbon dioxide and methane.
              Students should be able to: • describe actions to reduce emissions of carbon dioxide
              and methane • give reasons why actions may be limited.
      - title: Common atmospheric pollutants and their sources
        objectives:
          - ref: "4.9.3.1"
            foundation: >-
              The combustion of fuels is a major source of atmospheric pollutants. Most fuels,
              including coal, contain carbon and/or hydrogen and may also contain some sulfur. The
              gases released into the atmosphere when a fuel is burned may include carbon dioxide,
              water vapour, carbon monoxide, sulfur dioxide and oxides of nitrogen. Solid
              particles and unburned hydrocarbons may also be released that form particulates in
              the atmosphere. Students should be able to: • describe how carbon monoxide, soot
              (carbon particles), sulfur dioxide and oxides of nitrogen are produced by burning
              fuels • predict the products of combustion of a fuel given appropriate information
              about the composition of the fuel and the conditions in which it is used.
          - ref: "4.9.3.2"
            foundation: >-
              Carbon monoxide is a toxic gas. It is colourless and odourless and so is not easily
              detected. Sulfur dioxide and oxides of nitrogen cause respiratory problems in humans
              and cause acid rain. Particulates cause global dimming and health problems for
              humans. Students should be able to describe and explain the problems caused by
              increased amounts of these pollutants in the air.
  - ref: "4.10"
    title: Using resources
    subtopics:
      - title: Using the Earth's resources and obtaining potable water
        objectives:
          - ref: "4.10.1.1"
            foundation: >-
              Humans use the Earth’s resources to provide warmth, shelter, food and transport.
              Natural resources, supplemented by agriculture, provide food, timber, clothing and
              fuels. Finite resources from the Earth, oceans and atmosphere are processed to
              provide energy and materials. Chemistry plays an important role in improving
              agricultural and industrial processes to provide new products and in sustainable
              development, which is development that meets the needs of current generations
              without compromising the ability of future generations to meet their own needs.
              Students should be able to: • state examples of natural products that are
              supplemented or replaced by agricultural and synthetic products • distinguish
              between finite and renewable resources given appropriate information. Students
              should be able to: • extract and interpret information about resources from charts,
              graphs and tables • use orders of magnitude to evaluate the significance of data.
          - ref: "4.10.1.2"
            foundation: >-
              Water of appropriate quality is essential for life. For humans, drinking water
              should have sufficiently low levels of dissolved salts and microbes. Water that is
              safe to drink is called potable water. Potable water is not pure water in the
              chemical sense because it contains dissolved substances. The methods used to produce
              potable water depend on available supplies of water and local conditions. In the
              United Kingdom (UK), rain provides water with low levels of dissolved substances
              (fresh water) that collects in the ground and in lakes and rivers, and most potable
              water is produced by: • choosing an appropriate source of fresh water • passing the
              water through filter beds • sterilising. Sterilising agents used for potable water
              include chlorine, ozone or ultraviolet light. If supplies of fresh water are
              limited, desalination of salty water or sea water may be required. Desalination can
              be done by distillation or by processes that use membranes such as reverse osmosis.
              These processes require large amounts of energy. Students should be able to: •
              distinguish between potable water and pure water • describe the differences in
              treatment of ground water and salty water • give reasons for the steps used to
              produce potable water. Required practical 8: analysis and purification of water
              samples from different sources, including pH, dissolved solids and distillation.
          - ref: "4.10.1.3"
            foundation: >-
              Urban lifestyles and industrial processes produce large amounts of waste water that
              require treatment before being released into the environment. Sewage and
              agricultural waste water require removal of organic matter and harmful microbes.
              Industrial waste water may require removal of organic matter and harmful chemicals.
              Sewage treatment includes: • screening and grit removal • sedimentation to produce
              sewage sludge and effluent • anaerobic digestion of sewage sludge • aerobic
              biological treatment of effluent. Students should be able to comment on the relative
              ease of obtaining potable water from waste, ground and salt water.
          - ref: "4.10.1.4"
            higher: >-
              The Earth’s resources of metal ores are limited. Copper ores are becoming scarce and
              new ways of extracting copper from low-grade ores include phytomining, and
              bioleaching. These methods avoid traditional mining methods of digging, moving and
              disposing of large amounts of rock. Phytomining uses plants to absorb metal
              compounds. The plants are harvested and then burned to produce ash that contains
              metal compounds. Bioleaching uses bacteria to produce leachate solutions that
              contain metal compounds. The metal compounds can be processed to obtain the metal.
              For example, copper can be obtained from solutions of copper compounds by
              displacement using scrap iron or by electrolysis. Students should be able to
              evaluate alternative biological methods of metal extraction, given appropriate
              information.
      - title: Life cycle assessment and recycling
        objectives:
          - ref: "4.10.2.1"
            foundation: >-
              Life cycle assessments (LCAs) are carried out to assess the environmental impact of
              products in each of these stages: • extracting and processing raw materials •
              manufacturing and packaging • use and operation during its lifetime • disposal at
              the end of its useful life, including transport and distribution at each stage. Use
              of water, resources, energy sources and production of some wastes can be fairly
              easily quantified. Allocating numerical values to pollutant effects is less
              straightforward and requires value judgements, so LCA is not a purely objective
              process. Selective or abbreviated LCAs can be devised to evaluate a product but
              these can be misused to reach pre-determined conclusions, eg in support of claims
              for advertising purposes. Students should be able to carry out simple comparative
              LCAs for shopping bags made from plastic and paper.
          - ref: "4.10.2.2"
            foundation: >-
              The reduction in use, reuse and recycling of materials by end users reduces the use
              of limited resources, use of energy sources, waste and environmental impacts.
              Metals, glass, building materials, clay ceramics and most plastics are produced from
              limited raw materials. Much of the energy for the processes comes from limited
              resources. Obtaining raw materials from the Earth by quarrying and mining causes
              environmental impacts. Some products, such as glass bottles, can be reused. Glass
              bottles can be crushed and melted to make different glass products. Other products
              cannot be reused and so are recycled for a different use. Metals can be recycled by
              melting and recasting or reforming into different products. The amount of separation
              required for recycling depends on the material and the properties required of the
              final product. For example, some scrap steel can be added to iron from a blast
              furnace to reduce the amount of iron that needs to be extracted from iron ore.
              Students should be able to evaluate ways of reducing the use of limited resources,
              given appropriate information.
      - title: Using materials (chemistry only)
        objectives:
          - ref: "4.10.3.1"
            foundation: >-
              Corrosion is the destruction of materials by chemical reactions with substances in
              the environment. Rusting is an example of corrosion. Both air and water are
              necessary for iron to rust. Corrosion can be prevented by applying a coating that
              acts as a barrier, such as greasing, painting or electroplating. Aluminium has an
              oxide coating that protects the metal from further corrosion. Some coatings are
              reactive and contain a more reactive metal to provide sacrificial protection, eg
              zinc is used to galvanise iron. Students should be able to: • describe experiments
              and interpret results to show that both air and water are necessary for rusting •
              explain sacrificial protection in terms of relative reactivity.
          - ref: "4.10.3.2"
            foundation: >-
              Most metals in everyday use are alloys. Bronze is an alloy of copper and tin. Brass
              is an alloy of copper and zinc. Gold used as jewellery is usually an alloy with
              silver, copper and zinc. The proportion of gold in the alloy is measured in carats.
              24 carat being 100% (pure gold), and 18 carat being 75% gold. Steels are alloys of
              iron that contain specific amounts of carbon and other metals. High carbon steel is
              strong but brittle. Low carbon steel is softer and more easily shaped. Steels
              containing chromium and nickel (stainless steels) are hard and resistant to
              corrosion. Aluminium alloys are low density. Students should be able to: • recall a
              use of each of the alloys specified • interpret and evaluate the composition and
              uses of alloys other than those specified given appropriate information.
          - ref: "4.10.3.3"
            foundation: >-
              Most of the glass we use is soda-lime glass, made by heating a mixture of sand,
              sodium carbonate and limestone. Borosilicate glass, made from sand and boron
              trioxide, melts at higher temperatures than soda-lime glass. Clay ceramics,
              including pottery and bricks, are made by shaping wet clay and then heating in a
              furnace. The properties of polymers depend on what monomers they are made from and
              the conditions under which they are made. For example, low density (LD) and high
              density (HD) poly(ethene) are produced from ethene. Thermosoftening polymers melt
              when they are heated. Thermosetting polymers do not melt when they are heated.
              Students should be able to: • explain how low density and high density poly(ethene)
              are both produced from ethene • explain the difference between thermosoftening and
              thermosetting polymers in terms of their structures. Most composites are made of two
              materials, a matrix or binder surrounding and binding together fibres or fragments
              of the other material, which is called the reinforcement. Students should be able to
              recall some examples of composites. Students should be able to, given appropriate
              information: • compare quantitatively the physical properties of glass and clay
              ceramics, polymers, composites and metals • explain how the properties of materials
              are related to their uses and select appropriate materials.
      - title: The Haber process and the use of NPK fertilisers (chemistry
        objectives:
          - ref: "4.10.4.1"
            foundation: >-
              The Haber process is used to manufacture ammonia, which can be used to produce
              nitrogen-based fertilisers. The raw materials for the Haber process are nitrogen and
              hydrogen. Students should be able to recall a source for the nitrogen and a source
              for the hydrogen used in the Haber process. The purified gases are passed over a
              catalyst of iron at a high temperature (about 450°C) and a high pressure (about 200
              atmospheres). Some of the hydrogen and nitrogen reacts to form ammonia. The reaction
              is reversible so some of the ammonia produced breaks down into nitrogen and
              hydrogen: nitrogen + hydrogen ammonia On cooling, the ammonia liquefies and is
              removed. The remaining hydrogen and nitrogen are recycled.
            higher: >-
              The Haber process is used to manufacture ammonia, which can be used to produce
              nitrogen-based fertilisers. The raw materials for the Haber process are nitrogen and
              hydrogen. Students should be able to recall a source for the nitrogen and a source
              for the hydrogen used in the Haber process. The purified gases are passed over a
              catalyst of iron at a high temperature (about 450°C) and a high pressure (about 200
              atmospheres). Some of the hydrogen and nitrogen reacts to form ammonia. The reaction
              is reversible so some of the ammonia produced breaks down into nitrogen and
              hydrogen: nitrogen + hydrogen ammonia On cooling, the ammonia liquefies and is
              removed. The remaining hydrogen and nitrogen are recycled. (HT only) Students should
              be able to: • interpret graphs of reaction conditions versus rate • apply the
              principles of dynamic equilibrium in Reversible reactions and dynamic equilibrium
              (page 59) to the Haber process • explain the trade-off between rate of production
              and position of equilibrium • explain how the commercially used conditions for the
              Haber process are related to the availability and cost of raw materials and energy
              supplies, control of equilibrium position and rate.
          - ref: "4.10.4.2"
            foundation: >-
              Compounds of nitrogen, phosphorus and potassium are used as fertilisers to improve
              agricultural productivity. NPK fertilisers contain compounds of all three elements.
              Industrial production of NPK fertilisers can be achieved using a variety of raw
              materials in several integrated processes. NPK fertilisers are formulations of
              various salts containing appropriate percentages of the elements. Ammonia can be
              used to manufacture ammonium salts and nitric acid. Potassium chloride, potassium
              sulfate and phosphate rock are obtained by mining, but phosphate rock cannot be used
              directly as a fertiliser. Phosphate rock is treated with nitric acid or sulfuric
              acid to produce soluble salts that can be used as fertilisers. Students should be
              able to: • recall the names of the salts produced when phosphate rock is treated
              with nitric acid, sulfuric acid and phosphoric acid • compare the industrial
              production of fertilisers with laboratory preparations of the same compounds, given
              appropriate information.
