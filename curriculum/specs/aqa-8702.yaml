# curriculum/specs/aqa-8702.yaml
# AQA GCSE English Literature 8702, section 3 "Subject content", copied word
# for word from the specification PDF (Version 1.3, 28 September 2022, pp. 11–13).
#
# - The spec has no statement codes: refs are the section number, plus a
#   letter for each bullet in 3.3 Skills.
# - Set texts are the board's lists. Texts marked "(Last exam 2024)" are left
#   out (exams in 2028 can't use them): The History Boys; The Curious Incident
#   of the Dog in the Night-Time (play script); Never Let Me Go. Notes such as
#   "(First teaching 2023, first exam 2025)" are left off the titles.

specification:
  board: aqa
  subject: english-literature
  code: "8702"
  title: AQA GCSE English Literature
  version: Version 1.3 28 September 2022
  source_url: "https://filestore.aqa.org.uk/resources/english/specifications/AQA-8702-SP-2015.PDF"
  tiered: false

set_texts:
  - category: Shakespeare play
    options:
      - {title: Macbeth, author: William Shakespeare}
      - {title: Romeo and Juliet, author: William Shakespeare}
      - {title: The Tempest, author: William Shakespeare}
      - {title: The Merchant of Venice, author: William Shakespeare}
      - {title: Much Ado About Nothing, author: William Shakespeare}
      - {title: Julius Caesar, author: William Shakespeare}
  - category: 19th-century novel
    options:
      - {title: The Strange Case of Dr Jekyll and Mr Hyde, author: Robert Louis Stevenson}
      - {title: A Christmas Carol, author: Charles Dickens}
      - {title: Great Expectations (1867), author: Charles Dickens}
      - {title: Jane Eyre, author: Charlotte Brontë}
      - {title: Frankenstein (1831), author: Mary Shelley}
      - {title: Pride and Prejudice, author: Jane Austen}
      - {title: The Sign of Four, author: Sir Arthur Conan Doyle}
  - category: Modern prose or drama
    options:
      - {title: An Inspector Calls, author: JB Priestley}
      - {title: Blood Brothers (musical version), author: Willy Russell}
      - {title: DNA, author: Dennis Kelly}
      - {title: A Taste of Honey, author: Shelagh Delaney}
      - {title: Princess & The Hustler, author: Chinonyerem Odimba}
      - {title: Leave Taking, author: Winsome Pinnock}
      - {title: Lord of the Flies, author: William Golding}
      - {title: Telling Tales, author: AQA Anthology}
      - {title: Animal Farm, author: George Orwell}
      - {title: Anita and Me, author: Meera Syal}
      - {title: Pigeon English, author: Stephen Kelman}
      - {title: My Name is Leon, author: Kit de Waal}
  - category: Poetry anthology cluster
    options:
      - {title: Love and Relationships, author: AQA Poems Past and Present}
      - {title: Power and Conflict, author: AQA Poems Past and Present}
      - {title: Worlds and Lives, author: AQA Poems Past and Present}

topics:
  - ref: "3.1"
    title: Shakespeare and the 19th-century novel
    subtopics:
      - title: Shakespeare
        objectives:
          - ref: 3.1.1
            foundation: >-
              Students will study one play from the list of six set texts. Students should
              study the whole text.
      - title: The 19th-century novel
        objectives:
          - ref: 3.1.2
            foundation: >-
              Students will study one novel from the list of seven set texts. Students should
              study the whole text.
  - ref: "3.2"
    title: Modern texts and poetry
    subtopics:
      - title: Modern texts
        objectives:
          - ref: 3.2.1
            foundation: >-
              Students will study one from a choice of 12 set texts, which include post-1914
              prose fiction and drama. Students should study the whole text.
      - title: Poetry
        objectives:
          - ref: 3.2.2
            foundation: >-
              Students will study one cluster of poems taken from the AQA poetry anthology,
              Poems Past and Present. There is a choice of three clusters, each containing 15
              poems. The poems in each cluster are thematically linked and were written between
              1789 and the present day. Students should study all 15 poems in their chosen
              cluster and be prepared to write about any of them in the examination.
      - title: Unseen poetry
        objectives:
          - ref: 3.2.3
            foundation: >-
              In preparing for the unseen poetry section of the examination students should
              experience a wide range of poetry in order to develop their ability to closely
              analyse unseen poems. They should be able to analyse and compare key features
              such as their content, theme, structure and use of language.
  - ref: "3.3"
    title: Skills
    subtopics:
      - title: Reading comprehension and reading critically
        objectives:
          - ref: 3.3a
            foundation: >-
              literal and inferential comprehension: understanding a word, phrase or sentence in
              context; exploring aspects of plot, characterisation, events and settings;
              distinguishing between what is stated explicitly and what is implied; explaining
              motivation, sequence of events, and the relationship between actions or events
          - ref: 3.3b
            foundation: >-
              critical reading: identifying the theme and distinguishing between themes;
              supporting a point of view by referring to evidence in the text; recognising the
              possibility of and evaluating different responses to a text; using understanding of
              writers’ social, historical and cultural contexts to inform evaluation; making an
              informed personal response that derives from analysis and evaluation of the text
          - ref: 3.3c
            foundation: >-
              evaluation of a writer’s choice of vocabulary, grammatical and structural features:
              analysing and evaluating how language, structure, form and presentation contribute
              to quality and impact; using linguistic and literary terminology for such
              evaluation
          - ref: 3.3d
            foundation: >-
              comparing texts:comparing and contrasting texts studied, referring where relevant
              to theme, characterisation, context (where known), style and literary quality;
              comparing two texts critically with respect to the above
      - title: Writing
        objectives:
          - ref: 3.3e
            foundation: >-
              producing clear and coherent text: writing effectively about literature for a range
              of purposes such as: to describe, explain, summarise, argue, analyse and evaluate;
              discussing and maintaining a point of view; selecting and emphasising key points;
              using relevant quotation and using detailed textual references
          - ref: 3.3f
            foundation: >-
              accurate Standard English: accurate spelling, punctuation and grammar.
