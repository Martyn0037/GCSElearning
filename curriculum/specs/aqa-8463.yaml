      - title: Momentum
        objectives:
          - ref: "4.5.7.1"
            higher: >-
              Momentum is defined by the equation: momentum = mass × velocity p = m v momentum, p,
              in kilograms metre per second, kg m/s mass, m, in kilograms, kg velocity, v, in
              metres per second, m/s
          - ref: "4.5.7.2"
            higher: >-
              In a closed system, the total momentum before an event is equal to the total
              momentum after the event. This is called conservation of momentum. Students should
              be able to use the concept of momentum as a model to: • describe and explain
              examples of momentum in an event, such as a collision • (physics only) complete
              calculations involving an event, such as the collision of two objects.
          - ref: "4.5.7.3"
            higher: >-
              When a force acts on an object that is moving, or able to move, a change in momentum
              occurs. The equations F = m × a and $a = \frac{v - u}{t}$ combine to give the
              equation $F = \frac{m \Delta v}{\Delta t}$ where m∆v = change in momentum ie force
              equals the rate of change of momentum. Students should be able to explain safety
              features such as: air bags, seat belts, gymnasium crash mats, cycle helmets and
              cushioned surfaces for playgrounds with reference to the concept of rate of change
              of momentum. Students should be able to apply equations relating force, mass,
              velocity and acceleration to explain how the changes involved are inter-related.
  - ref: "4.6"
    title: Waves
    subtopics:
      - title: Waves in air, fluids and solids
        objectives:
          - ref: "4.6.1.1"
            foundation: >-
              Waves may be either transverse or longitudinal. The ripples on a water surface are
              an example of a transverse wave. Longitudinal waves show areas of compression and
              rarefaction. Sound waves travelling through air are longitudinal. Students should be
              able to describe the difference between longitudinal and transverse waves. Students
              should be able to describe evidence that, for both ripples on a water surface and
              sound waves in air, it is the wave and not the water or air itself that travels.
          - ref: "4.6.1.2"
            foundation: >-
              Students should be able to describe wave motion in terms of their amplitude,
              wavelength, frequency and period. The amplitude of a wave is the maximum
              displacement of a point on a wave away from its undisturbed position. The wavelength
              of a wave is the distance from a point on one wave to the equivalent point on the
              adjacent wave. The frequency of a wave is the number of waves passing a point each
              second. period = $\frac{1}{\text{frequency}}$ $T = \frac{1}{f}$ period, T, in
              seconds, s frequency, f, in hertz, Hz The wave speed is the speed at which the
              energy is transferred (or the wave moves) through the medium. All waves obey the
              wave equation: wave speed = frequency × wavelength v = f λ wave speed, v, in metres
              per second, m/s frequency, f, in hertz, Hz wavelength, λ, in metres, m Students
              should be able to: • identify amplitude and wavelength from given diagrams •
              describe a method to measure the speed of sound waves in air • describe a method to
              measure the speed of ripples on a water surface. (Physics only) Students should be
              able to show how changes in velocity, frequency and wavelength, in transmission of
              sound waves from one medium to another, are inter-related. Required practical
              activity 8: make observations to identify the suitability of apparatus to measure
              the frequency, wavelength and speed of waves in a ripple tank and waves in a solid
              and take appropriate measurements.
          - ref: "4.6.1.3"
            foundation: >-
              Waves can be reflected at the boundary between two different materials. Waves can be
              absorbed or transmitted at the boundary between two different materials. Students
              should be able to construct ray diagrams to illustrate the reflection of a wave at a
              surface. Students should be able to describe the effects of reflection, transmission
              and absorption of waves at material interfaces. Required practical activity 9
              (physics only): investigate the reflection of light by different types of surface
              and the refraction of light by different substances.
          - ref: "4.6.1.4"
            higher: >-
              Sound waves can travel through solids causing vibrations in the solid. Within the
              ear, sound waves cause the ear drum and other parts to vibrate which causes the
              sensation of sound. The conversion of sound waves to vibrations of solids works over
              a limited frequency range. This restricts the limits of human hearing. Students
              should be able to: • describe, with examples, processes which convert wave
              disturbances between sound waves and vibrations in solids. Examples may include the
              effect of sound waves on the ear drum • explain why such processes only work over a
              limited frequency range and the relevance of this to human hearing. Students should
              know that the range of normal human hearing is from 20 Hz to 20 kHz.
          - ref: "4.6.1.5"
            higher: >-
              Students should be able to explain in qualitative terms, how the differences in
              velocity, absorption and reflection between different types of wave in solids and
              liquids can be used both for detection and exploration of structures which are
              hidden from direct observation. Ultrasound waves have a frequency higher than the
              upper limit of hearing for humans. Ultrasound waves are partially reflected when
              they meet a boundary between two different media. The time taken for the reflections
              to reach a detector can be used to determine how far away such a boundary is. This
              allows ultrasound waves to be used for both medical and industrial imaging. Seismic
              waves are produced by earthquakes. P-waves are longitudinal, seismic waves. P-waves
              travel at different speeds through solids and liquids. S-waves are transverse,
              seismic waves. S-waves cannot travel through a liquid. P-waves and S-waves provide
              evidence for the structure and size of the Earth’s core. Echo sounding, using high
              frequency sound waves is used to detect objects in deep water and measure water
              depth. Students should be aware that the study of seismic waves provided new
              evidence that led to discoveries about parts of the Earth which are not directly
              observable.
      - title: Electromagnetic waves
        objectives:
          - ref: "4.6.2.1"
            foundation: >-
              Electromagnetic waves are transverse waves that transfer energy from the source of
              the waves to an absorber. Electromagnetic waves form a continuous spectrum and all
              types of electromagnetic wave travel at the same velocity through a vacuum (space)
              or air. The waves that form the electromagnetic spectrum are grouped in terms of
              their wavelength and their frequency. Going from long to short wavelength (or from
              low to high frequency) the groups are: radio, microwave, infrared, visible light
              (red to violet), ultraviolet, X-rays and gamma rays. Our eyes only detect visible
              light and so detect a limited range of electromagnetic waves. Students should be
              able to give examples that illustrate the transfer of energy by electromagnetic
              waves.
          - ref: "4.6.2.2"
            foundation: >-
              Students should be able to construct ray diagrams to illustrate the refraction of a
              wave at the boundary between two different media. Required practical activity 10:
              investigate how the amount of infrared radiation absorbed or radiated by a surface
              depends on the nature of that surface.
            higher: >-
              (HT only) Different substances may absorb, transmit, refract or reflect
              electromagnetic waves in ways that vary with wavelength. (HT only) Some effects, for
              example refraction, are due to the difference in velocity of the waves in different
              substances. Students should be able to construct ray diagrams to illustrate the
              refraction of a wave at the boundary between two different media. (HT only) Students
              should be able to use wave front diagrams to explain refraction in terms of the
              change of speed that happens when a wave travels from one medium to a different
              medium. Required practical activity 10: investigate how the amount of infrared
              radiation absorbed or radiated by a surface depends on the nature of that surface.
          - ref: "4.6.2.3"
            foundation: >-
              Changes in atoms and the nuclei of atoms can result in electromagnetic waves being
              generated or absorbed over a wide frequency range. Gamma rays originate from changes
              in the nucleus of an atom. Ultraviolet waves, X-rays and gamma rays can have
              hazardous effects on human body tissue. The effects depend on the type of radiation
              and the size of the dose. Radiation dose (in sieverts) is a measure of the risk of
              harm resulting from an exposure of the body to the radiation. 1000 millisieverts
              (mSv) = 1 sievert (Sv) Students will not be required to recall the unit of radiation
              dose. Students should be able to draw conclusions from given data about the risks
              and consequences of exposure to radiation. Ultraviolet waves can cause skin to age
              prematurely and increase the risk of skin cancer. X-rays and gamma rays are ionising
              radiation that can cause the mutation of genes and cancer.
            higher: >-
              (HT only) Radio waves can be produced by oscillations in electrical circuits. (HT
              only) When radio waves are absorbed they may create an alternating current with the
              same frequency as the radio wave itself, so radio waves can themselves induce
              oscillations in an electrical circuit. Changes in atoms and the nuclei of atoms can
              result in electromagnetic waves being generated or absorbed over a wide frequency
              range. Gamma rays originate from changes in the nucleus of an atom. Ultraviolet
              waves, X-rays and gamma rays can have hazardous effects on human body tissue. The
              effects depend on the type of radiation and the size of the dose. Radiation dose (in
              sieverts) is a measure of the risk of harm resulting from an exposure of the body to
              the radiation. 1000 millisieverts (mSv) = 1 sievert (Sv) Students will not be
              required to recall the unit of radiation dose. Students should be able to draw
              conclusions from given data about the risks and consequences of exposure to
              radiation. Ultraviolet waves can cause skin to age prematurely and increase the risk
              of skin cancer. X-rays and gamma rays are ionising radiation that can cause the
              mutation of genes and cancer.
          - ref: "4.6.2.4"
            foundation: >-
              Electromagnetic waves have many practical applications. For example: • radio waves –
              television and radio • microwaves – satellite communications, cooking food •
              infrared – electrical heaters, cooking food, infrared cameras • visible light –
              fibre optic communications • ultraviolet – energy efficient lamps, sun tanning •
              X-rays and gamma rays – medical imaging and treatments.
            higher: >-
              Electromagnetic waves have many practical applications. For example: • radio waves –
              television and radio • microwaves – satellite communications, cooking food •
              infrared – electrical heaters, cooking food, infrared cameras • visible light –
              fibre optic communications • ultraviolet – energy efficient lamps, sun tanning •
              X-rays and gamma rays – medical imaging and treatments. (HT only) Students should be
              able to give brief explanations why each type of electromagnetic wave is suitable
              for the practical application.
          - ref: "4.6.2.5"
            foundation: >-
              A lens forms an image by refracting light. In a convex lens, parallel rays of light
              are brought to a focus at the principal focus. The distance from the lens to the
              principal focus is called the focal length. Ray diagrams are used to show the
              formation of images by convex and concave lenses. The image produced by a convex
              lens can be either real or virtual. The image produced by a concave lens is always
              virtual. Students should be able to construct ray diagrams to illustrate the
              similarities and differences between convex and concave lenses. The magnification
              produced by a lens can be calculated using the equation: magnification =
              $\frac{\text{image height}}{\text{object height}}$ Magnification is a ratio and so
              has no units. Image height and object height should both be measured in either mm or
              cm. In ray diagrams a convex lens will be represented by: A concave lens will be
              represented by:
          - ref: "4.6.2.6"
            foundation: >-
              Each colour within the visible light spectrum has its own narrow band of wavelength
              and frequency. Reflection from a smooth surface in a single direction is called
              specular reflection. Reflection from a rough surface causes scattering: this is
              called diffuse reflection. Colour filters work by absorbing certain wavelengths (and
              colour) and transmitting other wavelengths (and colour). The colour of an opaque
              object is determined by which wavelengths of light are more strongly reflected.
              Wavelengths that are not reflected are absorbed. If all wavelengths are reflected
              equally the object appears white. If all wavelengths are absorbed the objects
              appears black. Objects that transmit light are either transparent or translucent.
              Students should be able to explain: • how the colour of an object is related to the
              differential absorption, transmission and reflection of different wavelengths of
              light by the object • the effect of viewing objects through filters or the effect on
              light of passing through filters • why an opaque object has a particular colour.
      - title: Black body radiation (physics only)
        objectives:
          - ref: "4.6.3.1"
            foundation: >-
              All bodies (objects), no matter what temperature, emit and absorb infrared
              radiation. The hotter the body, the more infrared radiation it radiates in a given
              time. A perfect black body is an object that absorbs all of the radiation incident
              on it. A black body does not reflect or transmit any radiation. Since a good
              absorber is also a good emitter, a perfect black body would be the best possible
              emitter.
          - ref: "4.6.3.2"
            foundation: >-
              Students should be able to explain: • that all bodies (objects) emit radiation •
              that the intensity and wavelength distribution of any emission depends on the
              temperature of the body.
            higher: >-
              Students should be able to explain: • that all bodies (objects) emit radiation •
              that the intensity and wavelength distribution of any emission depends on the
              temperature of the body. (HT only) A body at constant temperature is absorbing
              radiation at the same rate as it is emitting radiation. The temperature of a body
              increases when the body absorbs radiation faster than it emits radiation. (HT only)
              The temperature of the Earth depends on many factors including: the rates of
              absorption and emission of radiation, reflection of radiation into space. (HT only)
              Students should be able to explain how the temperature of a body is related to the
              balance between incoming radiation absorbed and radiation emitted, using everyday
              examples to illustrate this balance, and the example of the factors which determine
              the temperature of the Earth. (HT only) Students should be able to use information,
              or draw/ interpret diagrams to show how radiation affects the temperature of the
              Earth’s surface and atmosphere.
  - ref: "4.7"
    title: Magnetism and electromagnetism
    subtopics:
      - title: Permanent and induced magnetism, magnetic forces and fields
        objectives:
          - ref: "4.7.1.1"
            foundation: >-
              The poles of a magnet are the places where the magnetic forces are strongest. When
              two magnets are brought close together they exert a force on each other. Two like
              poles repel each other. Two unlike poles attract each other. Attraction and
              repulsion between two magnetic poles are examples of non-contact force. A permanent
              magnet produces its own magnetic field. An induced magnet is a material that becomes
              a magnet when it is placed in a magnetic field. Induced magnetism always causes a
              force of attraction. When removed from the magnetic field an induced magnet loses
              most/all of its magnetism quickly. Students should be able to describe: • the
              attraction and repulsion between unlike and like poles for permanent magnets • the
              difference between permanent and induced magnets.
          - ref: "4.7.1.2"
            foundation: >-
              The region around a magnet where a force acts on another magnet or on a magnetic
              material (iron, steel, cobalt and nickel) is called the magnetic field. The force
              between a magnet and a magnetic material is always one of attraction. The strength
              of the magnetic field depends on the distance from the magnet. The field is
              strongest at the poles of the magnet. The direction of the magnetic field at any
              point is given by the direction of the force that would act on another north pole
              placed at that point. The direction of a magnetic field line is from the north
              (seeking) pole of a magnet to the south(seeking) pole of the magnet. A magnetic
              compass contains a small bar magnet. The Earth has a magnetic field. The compass
              needle points in the direction of the Earth’s magnetic field. Students should be
              able to: • describe how to plot the magnetic field pattern of a magnet using a
              compass • draw the magnetic field pattern of a bar magnet showing how strength and
              direction change from one point to another • explain how the behaviour of a magnetic
              compass is related to evidence that the core of the Earth must be magnetic.
      - title: The motor effect
        objectives:
          - ref: "4.7.2.1"
            foundation: >-
              When a current flows through a conducting wire a magnetic field is produced around
              the wire. The strength of the magnetic field depends on the current through the wire
              and the distance from the wire. Shaping a wire to form a solenoid increases the
              strength of the magnetic field created by a current through the wire. The magnetic
              field inside a solenoid is strong and uniform. The magnetic field around a solenoid
              has a similar shape to that of a bar magnet. Adding an iron core increases the
              strength of the magnetic field of a solenoid. An electromagnet is a solenoid with an
              iron core. Students should be able to: • describe how the magnetic effect of a
              current can be demonstrated • draw the magnetic field pattern for a straight wire
              carrying a current and for a solenoid (showing the direction of the field) • explain
              how a solenoid arrangement can increase the magnetic effect of the current. (Physics
              only) Students should be able to interpret diagrams of electromagnetic devices in
              order to explain how they work.
          - ref: "4.7.2.2"
            higher: >-
              When a conductor carrying a current is placed in a magnetic field the magnet
              producing the field and the conductor exert a force on each other. This is called
              the motor effect. Students should be able to show that Fleming's left-hand rule
              represents the relative orientation of the force, the current in the conductor and
              the magnetic field. Students should be able to recall the factors that affect the
              size of the force on the conductor. For a conductor at right angles to a magnetic
              field and carrying a current: force = magnetic flux density × current × length F = B
              I l force, F, in newtons, N magnetic flux density, B, in tesla, T current, I, in
              amperes, A (amp is acceptable for ampere) length, l, in metres, m
          - ref: "4.7.2.3"
            higher: >-
              A coil of wire carrying a current in a magnetic field tends to rotate. This is the
              basis of an electric motor. Students should be able to explain how the force on a
              conductor in a magnetic field causes the rotation of the coil in an electric motor.
          - ref: "4.7.2.4"
            higher: >-
              Loudspeakers and headphones use the motor effect to convert variations in current in
              electrical circuits to the pressure variations in sound waves. Students should be
              able to explain how a moving-coil loudspeaker and headphones work.
      - title: Induced potential, transformers and the National Grid (physics
        objectives:
          - ref: "4.7.3.1"
            higher: >-
              If an electrical conductor moves relative to a magnetic field or if there is a
              change in the magnetic field around a conductor, a potential difference is induced
              across the ends of the conductor. If the conductor is part of a complete circuit, a
              current is induced in the conductor. This is called the generator effect. An induced
              current generates a magnetic field that opposes the original change, either the
              movement of the conductor or the change in magnetic field. Students should be able
              to recall the factors that affect the size of the induced potential
              difference/induced current. Students should be able to recall the factors that
              affect the direction of the induced potential difference/induced current. Students
              should be able to apply the principles of the generator effect in a given context.
          - ref: "4.7.3.2"
            higher: >-
              The generator effect is used in an alternator to generate ac and in a dynamo to
              generate dc. Students should be able to: • explain how the generator effect is used
              in an alternator to generate ac and in a dynamo to generate dc • draw/interpret
              graphs of potential difference generated in the coil against time.
          - ref: "4.7.3.3"
            higher: >-
              Microphones use the generator effect to convert the pressure variations in sound
              waves into variations in current in electrical circuits. Students should be able to
              explain how a moving-coil microphone works.
          - ref: "4.7.3.4"
            higher: >-
              A basic transformer consists of a primary coil and a secondary coil wound on an iron
              core. Iron is used as it is easily magnetised. Knowledge of laminations and eddy
              currents in the core is not required. The ratio of the potential differences across
              the primary and secondary coils of a transformer Vp and Vs depends on the ratio of
              the number of turns on each coil, np and ns . $\frac{V_p}{V_s} = \frac{n_p}{n_s}$
              potential difference, Vp and Vs in volts, V In a step-up transformer Vs > Vp In a
              step-down transformer Vs < Vp If transformers were 100% efficient, the electrical
              power output would equal the electrical power input. Vs × Is = Vp × Ip Where Vs × Is
              is the power output (secondary coil) and Vp × Ip is the power input (primary coil).
              power input and output, in watts, W Students should be able to: • explain how the
              effect of an alternating current in one coil in inducing a current in another is
              used in transformers • explain how the ratio of the potential differences across the
              two coils depends on the ratio of the number of turns on each • calculate the
              current drawn from the input supply to provide a particular power output • apply the
              equation linking the p.d.s and number of turns in the two coils of a transformer to
              the currents and the power transfer involved, and relate these to the advantages of
              power transmission at high potential differences.
  - ref: "4.8"
    title: Space physics (physics only)
    subtopics:
      - title: Solar system; stability of orbital motions; satellites (physics only)
        objectives:
          - ref: "4.8.1.1"
            foundation: >-
              Within our solar system there is one star, the Sun, plus the eight planets and the
              dwarf planets that orbit around the Sun. Natural satellites, the moons that orbit
              planets, are also part of the solar system. Our solar system is a small part of the
              Milky Way galaxy. The Sun was formed from a cloud of dust and gas (nebula) pulled
              together by gravitational attraction. Students should be able to explain: • how, at
              the start of a star's life cycle, the dust and gas drawn together by gravity causes
              fusion reactions • that fusion reactions lead to an equilibrium between the
              gravitational collapse of a star and the expansion of a star due to fusion energy.
          - ref: "4.8.1.2"
            foundation: >-
              A star goes through a life cycle. The life cycle is determined by the size of the
              star. Students should be able to describe the life cycle of a star: • the size of
              the Sun • much more massive than the Sun. Fusion processes in stars produce all of
              the naturally occurring elements. Elements heavier than iron are produced in a
              supernova. The explosion of a massive star (supernova) distributes the elements
              throughout the universe. Students should be able to explain how fusion processes
              lead to the formation of new elements.
          - ref: "4.8.1.3"
            foundation: >-
              Gravity provides the force that allows planets and satellites (both natural and
              artificial) to maintain their circular orbits. Students should be able to describe
              the similarities and distinctions between the planets, their moons, and artificial
              satellites.
            higher: >-
              Gravity provides the force that allows planets and satellites (both natural and
              artificial) to maintain their circular orbits. Students should be able to describe
              the similarities and distinctions between the planets, their moons, and artificial
              satellites. (HT only) Students should be able to explain qualitatively how: • (HT
              only) for circular orbits, the force of gravity can lead to changing velocity but
              unchanged speed • (HT only) for a stable orbit, the radius must change if the speed
              changes.
      - title: Red-shift (physics only)
        objectives:
          - ref: "4.8.2"
            foundation: >-
              There is an observed increase in the wavelength of light from most distant galaxies.
              The further away the galaxies, the faster they are moving and the bigger the
              observed increase in wavelength. This effect is called red-shift. The observed
              red-shift provides evidence that space itself (the universe) is expanding and
              supports the Big Bang theory. The Big Bang theory suggests that the universe began
              from a very small region that was extremely hot and dense. Since 1998 onwards,
              observations of supernovae suggest that distant galaxies are receding ever faster.
              Students should be able to explain: • qualitatively the red-shift of light from
              galaxies that are receding • that the change of each galaxy’s speed with distance is
              evidence of an expanding universe • how red-shift provides evidence for the Big Bang
              model • how scientists are able to use observations to arrive at theories such as
              the Big Bang theory • that there is still much about the universe that is not
              understood, for example dark mass and dark energy.
