# curriculum/specs/aqa-8463.yaml
# AQA GCSE Physics 8463, subject content copied word for word from the
# specification PDF (Version 1.1 30 September 2019).
#
# How it was transcribed (see curriculum/README.md):
# - Each numbered content unit (e.g. 4.1.1.1) is one statement: its "Content"
#   column. The "Key opportunities for skills development" column and the
#   practical-activity administration notes are not included.
# - "foundation" leaves out paragraphs and bullets marked (HT only); "higher"
#   is the full text. Units whose heading says (HT only) are Higher only.
# - Sub- and superscripts are written as Unicode (CO₂, m/s²). Equations whose
#   fractions the PDF typesets are written in LaTeX between $…$.
# - Diagrams, structural formulae, symbols and tables that the PDF prints as
#   images are not reproduced; where a sentence introduces one, it is left
#   as printed.

specification:
  board: aqa
  subject: physics
  code: "8463"
  title: AQA GCSE Physics
  version: Version 1.1 30 September 2019
  source_url: "https://filestore.aqa.org.uk/resources/physics/specifications/AQA-8463-SP-2016.PDF"
  tiered: true

topics:
  - ref: "4.1"
    title: Energy
    subtopics:
      - title: Energy changes in a system, and the ways energy is stored
        objectives:
          - ref: "4.1.1.1"
            foundation: >-
              A system is an object or group of objects. There are changes in the way energy is
              stored when a system changes. Students should be able to describe all the changes
              involved in the way energy is stored when a system changes, for common situations.
              For example: • an object projected upwards • a moving object hitting an obstacle •
              an object accelerated by a constant force • a vehicle slowing down • bringing water
              to a boil in an electric kettle. Throughout this section on Energy students should
              be able to calculate the changes in energy involved when a system is changed by: •
              heating • work done by forces • work done when a current flows • use calculations to
              show on a common scale how the overall energy in a system is redistributed when the
              system is changed.
          - ref: "4.1.1.2"
            foundation: >-
              Students should be able to calculate the amount of energy associated with a moving
              object, a stretched spring and an object raised above ground level. The kinetic
              energy of a moving object can be calculated using the equation: kinetic energy = 0.5
              × mass × speed² $E_k = \frac{1}{2} m v^2$ kinetic energy, Ek , in joules, J mass, m,
              in kilograms, kg speed, v, in metres per second, m/s The amount of elastic potential
              energy stored in a stretched spring can be calculated using the equation: elastic
              potential energy = 0.5 × spring constant × extension² $E_e = \frac{1}{2} k e^2$
              (assuming the limit of proportionality has not been exceeded) elastic potential
              energy, Ee , in joules, J spring constant, k, in newtons per metre, N/m extension,
              e, in metres, m The amount of gravitational potential energy gained by an object
              raised above ground level can be calculated using the equation: g . p . e . = mass ×
              gravitational field strength × height Ep = m g h gravitational potential energy, Ep
              , in joules, J mass, m, in kilograms, kg gravitational field strength, g, in newtons
              per kilogram, N/kg (In any calculation the value of the gravitational field strength
              (g) will be given). height, h, in metres, m
          - ref: "4.1.1.3"
            foundation: >-
              The amount of energy stored in or released from a system as its temperature changes
              can be calculated using the equation: change in thermal energy = mass × specific
              heat capacity × temperature change $\Delta E = m c \Delta \theta$ change in thermal
              energy, ∆E, in joules, J mass, m, in kilograms, kg specific heat capacity, c, in
              joules per kilogram per degree Celsius, J/kg °C temperature change, ∆θ, in degrees
              Celsius, °C The specific heat capacity of a substance is the amount of energy
              required to raise the temperature of one kilogram of the substance by one degree
              Celsius. Required practical activity 1: investigation to determine the specific heat
              capacity of one or more materials. The investigation will involve linking the
              decrease of one energy store (or work done) to the increase in temperature and
              subsequent increase in thermal energy stored.
          - ref: "4.1.1.4"
            foundation: >-
              Power is defined as the rate at which energy is transferred or the rate at which
              work is done. power = $\frac{\text{energy transferred}}{\text{time}}$ $P =
              \frac{E}{t}$ power = $\frac{\text{work done}}{\text{time}}$ $P = \frac{W}{t}$ power,
              P, in watts, W energy transferred, E, in joules, J time, t, in seconds, s work done,
              W, in joules, J An energy transfer of 1 joule per second is equal to a power of 1
              watt. Students should be able to give examples that illustrate the definition of
              power eg comparing two electric motors that both lift the same weight through the
              same height but one does it faster than the other.
      - title: Conservation and dissipation of energy
        objectives:
          - ref: "4.1.2.1"
            foundation: >-
              Energy can be transferred usefully, stored or dissipated, but cannot be created or
              destroyed. Students should be able to describe with examples where there are energy
              transfers in a closed system, that there is no net change to the total energy.
              Students should be able to describe, with examples, how in all system changes energy
              is dissipated, so that it is stored in less useful ways. This energy is often
              described as being ‘wasted’. Students should be able to explain ways of reducing
              unwanted energy transfers, for example through lubrication and the use of thermal
              insulation. The higher the thermal conductivity of a material the higher the rate of
              energy transfer by conduction across the material. Students should be able to
              describe how the rate of cooling of a building is affected by the thickness and
              thermal conductivity of its walls. Students do not need to know the definition of
              thermal conductivity. Required practical activity 2 (physics only): investigate the
              effectiveness of different materials as thermal insulators and the factors that may
              affect the thermal insulation properties of a material.
          - ref: "4.1.2.2"
            foundation: >-
              The energy efficiency for any energy transfer can be calculated using the equation:
              efficiency = $\frac{\text{useful output energy transfer}}{\text{total input energy
              transfer}}$ Efficiency may also be calculated using the equation: efficiency =
              $\frac{\text{useful power output}}{\text{total power input}}$
            higher: >-
              The energy efficiency for any energy transfer can be calculated using the equation:
              efficiency = $\frac{\text{useful output energy transfer}}{\text{total input energy
              transfer}}$ Efficiency may also be calculated using the equation: efficiency =
              $\frac{\text{useful power output}}{\text{total power input}}$ (HT only) Students
              should be able to describe ways to increase the efficiency of an intended energy
              transfer.
      - title: National and global energy resources
        objectives:
          - ref: "4.1.3"
            foundation: >-
              The main energy resources available for use on Earth include: fossil fuels (coal,
              oil and gas), nuclear fuel, bio-fuel, wind, hydro-electricity, geothermal, the
              tides, the Sun and water waves. A renewable energy resource is one that is being (or
              can be) replenished as it is used. The uses of energy resources include: transport,
              electricity generation and heating. Students should be able to: • describe the main
              energy sources available • distinguish between energy resources that are renewable
              and energy resources that are non-renewable • compare ways that different energy
              resources are used, the uses to include transport, electricity generation and
              heating • understand why some energy resources are more reliable than others •
              describe the environmental impact arising from the use of different energy resources
              • explain patterns and trends in the use of energy resources. Descriptions of how
              energy resources are used to generate electricity are not required. Students should
              be able to: • consider the environmental issues that may arise from the use of
              different energy resources • show that science has the ability to identify
              environmental issues arising from the use of energy resources but not always the
              power to deal with the issues because of political, social, ethical or economic
              considerations.
  - ref: "4.2"
    title: Electricity
    subtopics:
      - title: Current, potential difference and resistance
        objectives:
          - ref: "4.2.1.1"
            foundation: >-
              Circuit diagrams use standard symbols. Students should be able to draw and interpret
              circuit diagrams.
          - ref: "4.2.1.2"
            foundation: >-
              For electrical charge to flow through a closed circuit the circuit must include a
              source of potential difference. Electric current is a flow of electrical charge. The
              size of the electric current is the rate of flow of electrical charge. Charge flow,
              current and time are linked by the equation: charge flow = current × time Q = I t
              charge flow, Q, in coulombs, C current, I, in amperes, A (amp is acceptable for
              ampere) time, t, in seconds, s A current has the same value at any point in a single
              closed loop.
          - ref: "4.2.1.3"
            foundation: >-
              The current (I) through a component depends on both the resistance (R) of the
              component and the potential difference (V) across the component. The greater the
              resistance of the component the smaller the current for a given potential difference
              (pd) across the component. Questions will be set using the term potential
              difference. Students will gain credit for the correct use of either potential
              difference or voltage. Current, potential difference or resistance can be calculated
              using the equation: potential difference = current × resistance V = I R potential
              difference, V, in volts, V current, I, in amperes, A (amp is acceptable for ampere)
              resistance, R, in ohms, Ω Required practical activity 3: Use circuit diagrams to set
              up and check appropriate circuits to investigate the factors affecting the
              resistance of electrical circuits. This should include: • the length of a wire at
              constant temperature • combinations of resistors in series and parallel.
          - ref: "4.2.1.4"
            foundation: >-
              Students should be able to explain that, for some resistors, the value of R remains
              constant but that in others it can change as the current changes. The current
              through an ohmic conductor (at a constant temperature) is directly proportional to
              the potential difference across the resistor. This means that the resistance remains
              constant as the current changes. The resistance of components such as lamps, diodes,
              thermistors and LDRs is not constant; it changes with the current through the
              component. The resistance of a filament lamp increases as the temperature of the
              filament increases. The current through a diode flows in one direction only. The
              diode has a very high resistance in the reverse direction. The resistance of a
              thermistor decreases as the temperature increases. The applications of thermistors
              in circuits eg a thermostat is required. The resistance of an LDR decreases as light
              intensity increases. The application of LDRs in circuits eg switching lights on when
              it gets dark is required. Students should be able to: • explain the design and use
              of a circuit to measure the resistance of a component by measuring the current
              through, and potential difference across, the component • draw an appropriate
              circuit diagram using correct circuit symbols. Students should be able to use graphs
              to explore whether circuit elements are linear or non-linear and relate the curves
              produced to their function and properties. Required practical activity 4: use
              circuit diagrams to construct appropriate circuits to investigate the I–V
              characteristics of a variety of circuit elements, including a filament lamp, a diode
              and a resistor at constant temperature.
      - title: Series and parallel circuits
        objectives:
          - ref: "4.2.2"
            foundation: >-
              There are two ways of joining electrical components, in series and in parallel. Some
              circuits include both series and parallel parts. For components connected in series:
              • there is the same current through each component • the total potential difference
              of the power supply is shared between the components • the total resistance of two
              components is the sum of the resistance of each component. Rtotal = R₁ + R₂
              resistance, R, in ohms, Ω For components connected in parallel: • the potential
              difference across each component is the same • the total current through the whole
              circuit is the sum of the currents through the separate components • the total
              resistance of two resistors is less than the resistance of the smallest individual
              resistor. Students should be able to: • use circuit diagrams to construct and check
              series and parallel circuits that include a variety of common circuit components •
              describe the difference between series and parallel circuits • explain qualitatively
              why adding resistors in series increases the total resistance whilst adding
              resistors in parallel decreases the total resistance • explain the design and use of
              dc series circuits for measurement and testing purposes • calculate the currents,
              potential differences and resistances in dc series circuits • solve problems for
              circuits which include resistors in series using the concept of equivalent
              resistance. Students are not required to calculate the total resistance of two
              resistors joined in parallel.
      - title: Domestic uses and safety
        objectives:
          - ref: "4.2.3.1"
            foundation: >-
              Mains electricity is an ac supply. In the United Kingdom the domestic electricity
              supply has a frequency of 50 Hz and is about 230 V. Students should be able to
              explain the difference between direct and alternating potential difference.
          - ref: "4.2.3.2"
            foundation: >-
              Most electrical appliances are connected to the mains using three-core cable. The
              insulation covering each wire is colour coded for easy identification: live wire –
              brown neutral wire – blue earth wire – green and yellow stripes. The live wire
              carries the alternating potential difference from the supply. The neutral wire
              completes the circuit. The earth wire is a safety wire to stop the appliance
              becoming live. The potential difference between the live wire and earth (0 V) is
              about 230 V. The neutral wire is at, or close to, earth potential (0 V). The earth
              wire is at 0 V, it only carries a current if there is a fault. Students should be
              able to explain: • that a live wire may be dangerous even when a switch in the mains
              circuit is open • the dangers of providing any connection between the live wire and
              earth.
      - title: Energy transfers
        objectives:
          - ref: "4.2.4.1"
            foundation: >-
              Students should be able to explain how the power transfer in any circuit device is
              related to the potential difference across it and the current through it, and to the
              energy changes over time: power = potential difference × current P = V I power =
              current 2 × resistance P = I² R power, P, in watts, W potential difference, V, in
              volts, V current, I, in amperes, A (amp is acceptable for ampere) resistance, R, in
              ohms, Ω
          - ref: "4.2.4.2"
            foundation: >-
              Everyday electrical appliances are designed to bring about energy transfers. The
              amount of energy an appliance transfers depends on how long the appliance is
              switched on for and the power of the appliance. Students should be able to describe
              how different domestic appliances transfer energy from batteries or ac mains to the
              kinetic energy of electric motors or the energy of heating devices. Work is done
              when charge flows in a circuit. The amount of energy transferred by electrical work
              can be calculated using the equation: energy transferred = power × time E = P t
              energy transferred = charge flow × potential difference E = Q V energy transferred,
              E, in joules, J power, P, in watts, W time, t, in seconds, s charge flow, Q, in
              coulombs, C potential difference, V, in volts, V Students should be able to explain
              how the power of a circuit device is related to: • the potential difference across
              it and the current through it • the energy transferred over a given time. Students
              should be able to describe, with examples, the relationship between the power
              ratings for domestic electrical appliances and the changes in stored energy when
              they are in use.
          - ref: "4.2.4.3"
            foundation: >-
              The National Grid is a system of cables and transformers linking power stations to
              consumers. Electrical power is transferred from power stations to consumers using
              the National Grid. Step-up transformers are used to increase the potential
              difference from the power station to the transmission cables then step-down
              transformers are used to decrease, to a much lower value, the potential difference
              for domestic use. Students should be able to explain why the National Grid system is
              an efficient way to transfer energy.
      - title: Static electricity (physics only)
        objectives:
          - ref: "4.2.5.1"
            foundation: >-
              When certain insulating materials are rubbed against each other they become
              electrically charged. Negatively charged electrons are rubbed off one material and
              on to the other. The material that gains electrons becomes negatively charged. The
              material that loses electrons is left with an equal positive charge. When two
              electrically charged objects are brought close together they exert a force on each
              other. Two objects that carry the same type of charge repel. Two objects that carry
              different types of charge attract. Attraction and repulsion between two charged
              objects are examples of non-contact force. Students should be able to: • describe
              the production of static electricity, and sparking, by rubbing surfaces • describe
              evidence that charged objects exert forces of attraction or repulsion on one another
              when not in contact • explain how the transfer of electrons between objects can
              explain the phenomena of static electricity.
          - ref: "4.2.5.2"
            foundation: >-
              A charged object creates an electric field around itself. The electric field is
              strongest close to the charged object. The further away from the charged object, the
              weaker the field. A second charged object placed in the field experiences a force.
              The force gets stronger as the distance between the objects decreases. Students
              should be able to: • draw the electric field pattern for an isolated charged sphere
              • explain the concept of an electric field • explain how the concept of an electric
              field helps to explain the non-contact force between charged objects as well as
              other electrostatic phenomena such as sparking.
  - ref: "4.3"
    title: Particle model of matter
    subtopics:
      - title: Changes of state and the particle model
        objectives:
          - ref: "4.3.1.1"
            foundation: >-
              The density of a material is defined by the equation: density =
              $\frac{\text{mass}}{\text{volume}}$ $\rho = \frac{m}{V}$ density, ρ, in kilograms
              per metre cubed, kg/m³ mass, m, in kilograms, kg volume, V, in metres cubed, m³ The
              particle model can be used to explain • the different states of matter • differences
              in density. Students should be able to recognise/draw simple diagrams to model the
              difference between solids, liquids and gases. Students should be able to explain the
              differences in density between the different states of matter in terms of the
              arrangement of atoms or molecules. Required practical activity 5: use appropriate
              apparatus to make and record the measurements needed to determine the densities of
              regular and irregular solid objects and liquids. Volume should be determined from
              the dimensions of regularly shaped objects, and by a displacement technique for
              irregularly shaped objects. Dimensions to be measured using appropriate apparatus
              such as a ruler, micrometer or Vernier callipers.
          - ref: "4.3.1.2"
            foundation: >-
              Students should be able to describe how, when substances change state (melt, freeze,
              boil, evaporate, condense or sublimate), mass is conserved. Changes of state are
              physical changes which differ from chemical changes because the material recovers
              its original properties if the change is reversed.
      - title: Internal energy and energy transfers
        objectives:
          - ref: "4.3.2.1"
            foundation: >-
              Energy is stored inside a system by the particles (atoms and molecules) that make up
              the system. This is called internal energy. Internal energy is the total kinetic
              energy and potential energy of all the particles (atoms and molecules) that make up
              a system. Heating changes the energy stored within the system by increasing the
              energy of the particles that make up the system. This either raises the temperature
              of the system or produces a change of state.
          - ref: "4.3.2.2"
            foundation: >-
              If the temperature of the system increases, the increase in temperature depends on
              the mass of the substance heated, the type of material and the energy input to the
              system. The following equation applies: change in thermal energy = mass × specific
              heat capacity × temperature change $\Delta E = m c \Delta \theta$ change in thermal
              energy, ∆E, in joules, J mass, m, in kilograms, kg specific heat capacity, c, in
              joules per kilogram per degree Celsius, J/kg °C temperature change, ∆θ, in degrees
              Celsius, °C. The specific heat capacity of a substance is the amount of energy
              required to raise the temperature of one kilogram of the substance by one degree
              Celsius.
          - ref: "4.3.2.3"
            foundation: >-
              If a change of state happens: The energy needed for a substance to change state is
              called latent heat. When a change of state occurs, the energy supplied changes the
              energy stored (internal energy) but not the temperature. The specific latent heat of
              a substance is the amount of energy required to change the state of one kilogram of
              the substance with no change in temperature. energy for a change of state = mass ×
              specific latent heat E = m L energy, E, in joules, J mass, m, in kilograms, kg
              specific latent heat, L, in joules per kilogram, J/kg Specific latent heat of fusion
              – change of state from solid to liquid Specific latent heat of vaporisation – change
              of state from liquid to vapour Students should be able to interpret heating and
              cooling graphs that include changes of state. Students should be able to distinguish
              between specific heat capacity and specific latent heat.
      - title: Particle model and pressure
        objectives:
          - ref: "4.3.3.1"
            foundation: >-
              The molecules of a gas are in constant random motion. The temperature of the gas is
              related to the average kinetic energy of the molecules. Changing the temperature of
              a gas, held at constant volume, changes the pressure exerted by the gas. Students
              should be able to: • explain how the motion of the molecules in a gas is related to
              both its temperature and its pressure • explain qualitatively the relation between
              the temperature of a gas and its pressure at constant volume.
          - ref: "4.3.3.2"
            foundation: >-
              A gas can be compressed or expanded by pressure changes. The pressure produces a net
              force at right angles to the wall of the gas container (or any surface). Students
              should be able to use the particle model to explain how increasing the volume in
              which a gas is contained, at constant temperature, can lead to a decrease in
              pressure. For a fixed mass of gas held at a constant temperature: pressure × volume
              = constant p V = constant pressure, p, in pascals, Pa volume, V, in metres cubed, m³
              Students should be able to calculate the change in the pressure of a gas or the
              volume of a gas (a fixed mass held at constant temperature) when either the pressure
              or volume is increased or decreased.
          - ref: "4.3.3.3"
            higher: >-
              Work is the transfer of energy by a force. Doing work on a gas increases the
              internal energy of the gas and can cause an increase in the temperature of the gas.
              Students should be able to explain how, in a given situation eg a bicycle pump,
              doing work on an enclosed gas leads to an increase in the temperature of the gas.
  - ref: "4.4"
    title: Atomic structure
    subtopics:
      - title: Atoms and isotopes
        objectives:
          - ref: "4.4.1.1"
            foundation: >-
              Atoms are very small, having a radius of about 1 × 10⁻¹⁰ metres. The basic structure
              of an atom is a positively charged nucleus composed of both protons and neutrons
              surrounded by negatively charged electrons. The radius of a nucleus is less than
              1/10 000 of the radius of an atom. Most of the mass of an atom is concentrated in
              the nucleus. The electrons are arranged at different distances from the nucleus
              (different energy levels). The electron arrangements may change with the absorption
              of electromagnetic radiation (move further from the nucleus; a higher energy level)
              or by the emission of electromagnetic radiation (move closer to the nucleus; a lower
              energy level).
          - ref: "4.4.1.2"
            foundation: >-
              In an atom the number of electrons is equal to the number of protons in the nucleus.
              Atoms have no overall electrical charge. All atoms of a particular element have the
              same number of protons. The number of protons in an atom of an element is called its
              atomic number. The total number of protons and neutrons in an atom is called its
              mass number. Atoms can be represented as shown in this example: Atoms of the same
              element can have different numbers of neutrons; these atoms are called isotopes of
              that element. Atoms turn into positive ions if they lose one or more outer
              electron(s). Students should be able to relate differences between isotopes to
              differences in conventional representations of their identities, charges and masses.
          - ref: "4.4.1.3"
            foundation: >-
              New experimental evidence may lead to a scientific model being changed or replaced.
              Before the discovery of the electron, atoms were thought to be tiny spheres that
              could not be divided. The discovery of the electron led to the plum pudding model of
              the atom. The plum pudding model suggested that the atom is a ball of positive
              charge with negative electrons embedded in it. The results from the alpha particle
              scattering experiment led to the conclusion that the mass of an atom was
              concentrated at the centre (nucleus) and that the nucleus was charged. This nuclear
              model replaced the plum pudding model. Niels Bohr adapted the nuclear model by
              suggesting that electrons orbit the nucleus at specific distances. The theoretical
              calculations of Bohr agreed with experimental observations. Later experiments led to
              the idea that the positive charge of any nucleus could be subdivided into a whole
              number of smaller particles, each particle having the same amount of positive
              charge. The name proton was given to these particles. The experimental work of James
              Chadwick provided the evidence to show the existence of neutrons within the nucleus.
              This was about 20 years after the nucleus became an accepted scientific idea.
              Students should be able to describe: • why the new evidence from the scattering
              experiment led to a change in the atomic model • the difference between the plum
              pudding model of the atom and the nuclear model of the atom. Details of experimental
              work supporting the Bohr model are not required. Details of Chadwick’s experimental
              work are not required.
      - title: Atoms and nuclear radiation
        objectives:
          - ref: "4.4.2.1"
            foundation: >-
              Some atomic nuclei are unstable. The nucleus gives out radiation as it changes to
              become more stable. This is a random process called radioactive decay. Activity is
              the rate at which a source of unstable nuclei decays. Activity is measured in
              becquerel (Bq) Count-rate is the number of decays recorded each second by a detector
              (eg Geiger-Muller tube). The nuclear radiation emitted may be: • an alpha particle
              (α) – this consists of two neutrons and two protons, it is the same as a helium
              nucleus • a beta particle (β) – a high speed electron ejected from the nucleus as a
              neutron turns into a proton • a gamma ray (γ) – electromagnetic radiation from the
              nucleus • a neutron (n). Required knowledge of the properties of alpha particles,
              beta particles and gamma rays is limited to their penetration through materials,
              their range in air and ionising power. Students should be able to apply their
              knowledge to the uses of radiation and evaluate the best sources of radiation to use
              in a given situation.
          - ref: "4.4.2.2"
            foundation: >-
              Nuclear equations are used to represent radioactive decay. In a nuclear equation an
              alpha particle may be represented by the symbol: and a beta particle by the symbol:
              The emission of the different types of nuclear radiation may cause a change in the
              mass and /or the charge of the nucleus. For example: So alpha decay causes both the
              mass and charge of the nucleus to decrease. So beta decay does not cause the mass of
              the nucleus to change but does cause the charge of the nucleus to increase. Students
              are not required to recall these two examples. Students should be able to use the
              names and symbols of common nuclei and particles to write balanced equations that
              show single alpha (α) and beta (β) decay. This is limited to balancing the atomic
              numbers and mass numbers. The identification of daughter elements from such decays
              is not required. The emission of a gamma ray does not cause the mass or the charge
              of the nucleus to change.
          - ref: "4.4.2.3"
            foundation: >-
              Radioactive decay is random. The half-life of a radioactive isotope is the time it
              takes for the number of nuclei of the isotope in a sample to halve, or the time it
              takes for the count rate (or activity) from a sample containing the isotope to fall
              to half its initial level. Students should be able to explain the concept of
              half-life and how it is related to the random nature of radioactive decay. Students
              should be able to determine the half-life of a radioactive isotope from given
              information.
            higher: >-
              Radioactive decay is random. The half-life of a radioactive isotope is the time it
              takes for the number of nuclei of the isotope in a sample to halve, or the time it
              takes for the count rate (or activity) from a sample containing the isotope to fall
              to half its initial level. Students should be able to explain the concept of
              half-life and how it is related to the random nature of radioactive decay. Students
              should be able to determine the half-life of a radioactive isotope from given
              information. (HT only) Students should be able to calculate the net decline,
              expressed as a ratio, in a radioactive emission after a given number of half-lives.
          - ref: "4.4.2.4"
            foundation: >-
              Radioactive contamination is the unwanted presence of materials containing
              radioactive atoms on other materials. The hazard from contamination is due to the
              decay of the contaminating atoms. The type of radiation emitted affects the level of
              hazard. Irradiation is the process of exposing an object to nuclear radiation. The
              irradiated object does not become radioactive. Students should be able to compare
              the hazards associated with contamination and irradiation. Suitable precautions must
              be taken to protect against any hazard that the radioactive source used in the
              process of irradiation may present. Students should understand that it is important
              for the findings of studies into the effects of radiation on humans to be published
              and shared with other scientists so that the findings can be checked by peer review.
      - title: Hazards and uses of radioactive emissions and of background
        objectives:
          - ref: "4.4.3.1"
            foundation: >-
              Background radiation is around us all of the time. It comes from: • natural sources
              such as rocks and cosmic rays from space • man-made sources such as the fallout from
              nuclear weapons testing and nuclear accidents. The level of background radiation and
              radiation dose may be affected by occupation and/or location. Radiation dose is
              measured in sieverts (Sv) 1000 millisieverts (mSv) = 1 sievert (Sv) Students will
              not need to recall the unit of radiation dose.
          - ref: "4.4.3.2"
            foundation: >-
              Radioactive isotopes have a very wide range of half-life values. Students should be
              able to explain why the hazards associated with radioactive material differ
              according to the half-life involved.
          - ref: "4.4.3.3"
            foundation: >-
              Nuclear radiations are used in medicine for the: • exploration of internal organs •
              control or destruction of unwanted tissue. Students should be able to: • describe
              and evaluate the uses of nuclear radiations for exploration of internal organs, and
              for control or destruction of unwanted tissue • evaluate the perceived risks of
              using nuclear radiations in relation to given data and consequences.
      - title: Nuclear fission and fusion (physics only)
        objectives:
          - ref: "4.4.4.1"
            foundation: >-
              Nuclear fission is the splitting of a large and unstable nucleus (eg uranium or
              plutonium). Spontaneous fission is rare. Usually, for fission to occur the unstable
              nucleus must first absorb a neutron. The nucleus undergoing fission splits into two
              smaller nuclei, roughly equal in size, and emits two or three neutrons plus gamma
              rays. Energy is released by the fission reaction. All of the fission products have
              kinetic energy. The neutrons may go on to start a chain reaction. The chain reaction
              is controlled in a nuclear reactor to control the energy released. The explosion
              caused by a nuclear weapon is caused by an uncontrolled chain reaction. Students
              should be able to draw/interpret diagrams representing nuclear fission and how a
              chain reaction may occur.
          - ref: "4.4.4.2"
            foundation: >-
              Nuclear fusion is the joining of two light nuclei to form a heavier nucleus. In this
              process some of the mass may be converted into the energy of radiation.
  - ref: "4.5"
    title: Forces
    subtopics:
      - title: Forces and their interactions
        objectives:
          - ref: "4.5.1.1"
            foundation: >-
              Scalar quantities have magnitude only. Vector quantities have magnitude and an
              associated direction. A vector quantity may be represented by an arrow. The length
              of the arrow represents the magnitude, and the direction of the arrow the direction
              of the vector quantity.
          - ref: "4.5.1.2"
            foundation: >-
              A force is a push or pull that acts on an object due to the interaction with another
              object. All forces between objects are either: • contact forces – the objects are
              physically touching • non-contact forces – the objects are physically separated.
              Examples of contact forces include friction, air resistance, tension and normal
              contact force. Examples of non-contact forces are gravitational force, electrostatic
              force and magnetic force. Force is a vector quantity. Students should be able to
              describe the interaction between pairs of objects which produce a force on each
              object. The forces to be represented as vectors.
          - ref: "4.5.1.3"
            foundation: >-
              Weight is the force acting on an object due to gravity. The force of gravity close
              to the Earth is due to the gravitational field around the Earth. The weight of an
              object depends on the gravitational field strength at the point where the object is.
              The weight of an object can be calculated using the equation: weight = mass ×
              gravitational field strength W = m g weight, W, in newtons, N mass, m, in kilograms,
              kg gravitational field strength, g, in newtons per kilogram, N/kg (In any
              calculation the value of the gravitational field strength (g) will be given.) The
              weight of an object may be considered to act at a single point referred to as the
              object’s ‘centre of mass’. The weight of an object and the mass of an object are
              directly proportional. Weight is measured using a calibrated spring-balance (a
              newtonmeter).
          - ref: "4.5.1.4"
            foundation: >-
              A number of forces acting on an object may be replaced by a single force that has
              the same effect as all the original forces acting together. This single force is
              called the resultant force. Students should be able to calculate the resultant of
              two forces that act in a straight line.
            higher: >-
              A number of forces acting on an object may be replaced by a single force that has
              the same effect as all the original forces acting together. This single force is
              called the resultant force. Students should be able to calculate the resultant of
              two forces that act in a straight line. (HT only) Students should be able to: •
              describe examples of the forces acting on an isolated object or system • use free
              body diagrams to describe qualitatively examples where several forces lead to a
              resultant force on an object, including balanced forces when the resultant force is
              zero. (HT only) A single force can be resolved into two components acting at right
              angles to each other. The two component forces together have the same effect as the
              single force. (HT only) Students should be able to use vector diagrams to illustrate
              resolution of forces, equilibrium situations and determine the resultant of two
              forces, to include both magnitude and direction (scale drawings only).
      - title: Work done and energy transfer
        objectives:
          - ref: "4.5.2"
            foundation: >-
              When a force causes an object to move through a distance work is done on the object.
              So a force does work on an object when the force causes a displacement of the
              object. The work done by a force on an object can be calculated using the equation:
              work done = force × distance moved along the line of action of the force W = F s
              work done, W, in joules, J force, F, in newtons, N distance, s, in metres One joule
              of work is done when a force of one newton causes a displacement of one metre. 1
              joule = 1 newton-metre Students should be able to describe the energy transfer
              involved when work is done. Students should be able to convert between newton-metres
              and joules. Work done against the frictional forces acting on an object causes arise
              in the temperature of the object.
      - title: Forces and elasticity
        objectives:
          - ref: "4.5.3"
            foundation: >-
              Students should be able to: • give examples of the forces involved in stretching,
              bending or compressing an object • explain why, to change the shape of an object (by
              stretching, bending or compressing), more than one force has to be applied – this is
              limited to stationary objects only • describe the difference between elastic
              deformation and inelastic deformation caused by stretching forces. The extension of
              an elastic object, such as a spring, is directly proportional to the force applied,
              provided that the limit of proportionality is not exceeded. force = spring constant
              × extension F = k e force, F, in newtons, N spring constant, k, in newtons per
              metre, N/m extension, e, in metres, m This relationship also applies to the
              compression of an elastic object, where ‘e’ would be the compression of the object.
              A force that stretches (or compresses) a spring does work and elastic potential
              energy is stored in the spring. Provided the spring is not inelastically deformed,
              the work done on the spring and the elastic potential energy stored are equal.
              Students should be able to: • describe the difference between a linear and
              non-linear relationship between force and extension • calculate a spring constant in
              linear cases • interpret data from an investigation of the relationship between
              force and extension • calculate work done in stretching (or compressing) a spring
              (up to the limit of proportionality) using the equation: elastic potential energy =
              0.5 × spring constant × extension² $E_e = \frac{1}{2} k e^2$ Students should be able
              to calculate relevant values of stored energy and energy transfers. Required
              practical activity 6: investigate the relationship between force and extension for a
              spring.
      - title: Moments, levers and gears (physics only)
        objectives:
          - ref: "4.5.4"
            foundation: >-
              A force or a system of forces may cause an object to rotate. Students should be able
              to describe examples in which forces cause rotation. The turning effect of a force
              is called the moment of the force. The size of the moment is defined by the
              equation: moment of a force = force × distance M = F d moment of a force, M, in
              newton-metres, Nm force, F, in newtons, N distance, d, is the perpendicular distance
              from the pivot to the line of action of the force, in metres, m. If an object is
              balanced, the total clockwise moment about a pivot equals the total anticlockwise
              moment about that pivot. Students should be able to calculate the size of a force,
              or its distance from a pivot, acting on an object that is balanced. A simple lever
              and a simple gear system can both be used to transmit the rotational effects of
              forces. Students should be able to explain how levers and gears transmit the
              rotational effects of forces.
      - title: Pressure and pressure differences in fluids (physics only)
        objectives:
          - ref: "4.5.5.1"
            foundation: >-
              A fluid can be either a liquid or a gas. The pressure in fluids causes a force
              normal (at right angles) to any surface. The pressure at the surface of a fluid can
              be calculated using the equation: pressure = $\frac{\text{force normal to a
              surface}}{\text{area of that surface}}$ $p = \frac{F}{A}$ pressure, p, in pascals,
              Pa force, F, in newtons, N area, A, in metres squared, m² 4.5.5.1.2 Pressure in a
              fluid 2 (HT only) The pressure due to a column of liquid can be calculated using the
              equation: pressure = height of the column × density of the liquid × gravitational
              field strength [ p = h ρ g ] pressure, p, in pascals, Pa height of the column, h, in
              metres, m density, ρ, in kilograms per metre cubed, kg/m³ gravitational field
              strength, g, in newtons per kilogram, N/kg (In any calculation the value of the
              gravitational field strength (g) will be given.) Students should be able to explain
              why, in a liquid, pressure at a point increases with the height of the column of
              liquid above that point and with the density of the liquid. Students should be able
              to calculate the differences in pressure at different depths in a liquid. A
              partially (or totally) submerged object experiences a greater pressure on the bottom
              surface than on the top surface. This creates a resultant force upwards. This force
              is called the upthrust. Students should be able to describe the factors which
              influence floating and sinking.
          - ref: "4.5.5.2"
            foundation: >-
              The atmosphere is a thin layer (relative to the size of the Earth) of air round the
              Earth. The atmosphere gets less dense with increasing altitude. Air molecules
              colliding with a surface create atmospheric pressure. The number of air molecules
              (and so the weight of air) above a surface decreases as the height of the surface
              above ground level increases. So as height increases there is always less air above
              a surface than there is at a lower height. So atmospheric pressure decreases with an
              increase in height. Students should be able to: • describe a simple model of the
              Earth’s atmosphere and of atmospheric pressure • explain why atmospheric pressure
              varies with height above a surface.
      - title: Forces and motion
        objectives:
          - ref: "4.5.6.1"
            foundation: >-
              Distance is how far an object moves. Distance does not involve direction. Distance
              is a scalar quantity. Displacement includes both the distance an object moves,
              measured in a straight line from the start point to the finish point and the
              direction of that straight line. Displacement is a vector quantity. Students should
              be able to express a displacement in terms of both the magnitude and direction.
              4.5.6.1.2 Speed Speed does not involve direction. Speed is a scalar quantity. The
              speed of a moving object is rarely constant. When people walk, run or travel in a
              car their speed is constantly changing. The speed at which a person can walk, run or
              cycle depends on many factors including: age, terrain, fitness and distance
              travelled. Typical values may be taken as: walking ̴ 1.5 m/s running ̴ 3 m/s cycling
              ̴ 6 m/s. Students should be able to recall typical values of speed for a person
              walking, running and cycling as well as the typical values of speed for different
              types of transportation systems. It is not only moving objects that have varying
              speed. The speed of sound and the speed of the wind also vary. A typical value for
              the speed of sound in air is 330 m/s. Students should be able to make measurements
              of distance and time and then calculate speeds of objects. For an object moving at
              constant speed the distance travelled in a specific time can be calculated using the
              equation: distance travelled = speed × time $s = v t$ distance, s, in metres, m
              speed, v, in metres per second, m/s time, t, in seconds, s Students should be able
              to calculate average speed for non-uniform motion. 4.5.6.1.3 Velocity The velocity
              of an object is its speed in a given direction. Velocity is a vector quantity.
              Students should be able to explain the vector–scalar distinction as it applies to
              displacement, distance, velocity and speed. 4.5.6.1.4 The distance–time relationship
              If an object moves along a straight line, the distance travelled can be represented
              by a distance–time graph. The speed of an object can be calculated from the gradient
              of its distance–time graph. Students should be able to draw distance–time graphs
              from measurements and extract and interpret lines and slopes of distance–time
              graphs, translating information between graphical and numerical form. Students
              should be able to determine speed from a distance–time graph. 4.5.6.1.5 Acceleration
              The average acceleration of an object can be calculated using the equation:
              acceleration = $\frac{\text{change in velocity}}{\text{time taken}}$ $a =
              \frac{\Delta v}{t}$ acceleration, a, in metres per second squared, m/s² change in
              velocity, ∆v, in metres per second, m/s time, t, in seconds, s An object that slows
              down is decelerating. Students should be able to estimate the magnitude of everyday
              accelerations. The acceleration of an object can be calculated from the gradient of
              a velocity–time graph. Students should be able to: • draw velocity–time graphs from
              measurements and interpret lines and slopes to determine acceleration The following
              equation applies to uniform acceleration: final velocity 2 − initial velocity 2 = 2
              × acceleration × distance v² − u² = 2 a s final velocity, v, in metres per second,
              m/s initial velocity, u, in metres per second, m/s acceleration, a, in metres per
              second squared, m/s² distance, s, in metres, m Near the Earth’s surface any object
              falling freely under gravity has an acceleration of about 9.8 m/s² . An object
              falling through a fluid initially accelerates due to the force of gravity.
              Eventually the resultant force will be zero and the object will move at its terminal
              velocity. (Physics only) Students should be able to: • draw and interpret
              velocity–time graphs for objects that reach terminal velocity • interpret the
              changing motion in terms of the forces acting.
            higher: >-
              Distance is how far an object moves. Distance does not involve direction. Distance
              is a scalar quantity. Displacement includes both the distance an object moves,
              measured in a straight line from the start point to the finish point and the
              direction of that straight line. Displacement is a vector quantity. Students should
              be able to express a displacement in terms of both the magnitude and direction.
              4.5.6.1.2 Speed Speed does not involve direction. Speed is a scalar quantity. The
              speed of a moving object is rarely constant. When people walk, run or travel in a
              car their speed is constantly changing. The speed at which a person can walk, run or
              cycle depends on many factors including: age, terrain, fitness and distance
              travelled. Typical values may be taken as: walking ̴ 1.5 m/s running ̴ 3 m/s cycling
              ̴ 6 m/s. Students should be able to recall typical values of speed for a person
              walking, running and cycling as well as the typical values of speed for different
              types of transportation systems. It is not only moving objects that have varying
              speed. The speed of sound and the speed of the wind also vary. A typical value for
              the speed of sound in air is 330 m/s. Students should be able to make measurements
              of distance and time and then calculate speeds of objects. For an object moving at
              constant speed the distance travelled in a specific time can be calculated using the
              equation: distance travelled = speed × time $s = v t$ distance, s, in metres, m
              speed, v, in metres per second, m/s time, t, in seconds, s Students should be able
              to calculate average speed for non-uniform motion. 4.5.6.1.3 Velocity The velocity
              of an object is its speed in a given direction. Velocity is a vector quantity.
              Students should be able to explain the vector–scalar distinction as it applies to
              displacement, distance, velocity and speed. (HT only) Students should be able to
              explain qualitatively, with examples, that motion in a circle involves constant
              speed but changing velocity. 4.5.6.1.4 The distance–time relationship If an object
              moves along a straight line, the distance travelled can be represented by a
              distance–time graph. The speed of an object can be calculated from the gradient of
              its distance–time graph. (HT only) If an object is accelerating, its speed at any
              particular time can be determined by drawing a tangent and measuring the gradient of
              the distance–time graph at that time. Students should be able to draw distance–time
              graphs from measurements and extract and interpret lines and slopes of distance–time
              graphs, translating information between graphical and numerical form. Students
              should be able to determine speed from a distance–time graph. 4.5.6.1.5 Acceleration
              The average acceleration of an object can be calculated using the equation:
              acceleration = $\frac{\text{change in velocity}}{\text{time taken}}$ $a =
              \frac{\Delta v}{t}$ acceleration, a, in metres per second squared, m/s² change in
              velocity, ∆v, in metres per second, m/s time, t, in seconds, s An object that slows
              down is decelerating. Students should be able to estimate the magnitude of everyday
              accelerations. The acceleration of an object can be calculated from the gradient of
              a velocity–time graph. (HT only) The distance travelled by an object (or
              displacement of an object) can be calculated from the area under a velocity–time
              graph. Students should be able to: • draw velocity–time graphs from measurements and
              interpret lines and slopes to determine acceleration • (HT only) interpret enclosed
              areas in velocity–time graphs to determine distance travelled (or displacement) •
              (HT only) measure, when appropriate, the area under a velocity–time graph by
              counting squares. The following equation applies to uniform acceleration: final
              velocity 2 − initial velocity 2 = 2 × acceleration × distance v² − u² = 2 a s final
              velocity, v, in metres per second, m/s initial velocity, u, in metres per second,
              m/s acceleration, a, in metres per second squared, m/s² distance, s, in metres, m
              Near the Earth’s surface any object falling freely under gravity has an acceleration
              of about 9.8 m/s² . An object falling through a fluid initially accelerates due to
              the force of gravity. Eventually the resultant force will be zero and the object
              will move at its terminal velocity. (Physics only) Students should be able to: •
              draw and interpret velocity–time graphs for objects that reach terminal velocity •
              interpret the changing motion in terms of the forces acting.
          - ref: "4.5.6.2"
            foundation: >-
              Newton’s First Law: If the resultant force acting on an object is zero and: • the
              object is stationary, the object remains stationary • the object is moving, the
              object continues to move at the same speed and in the same direction. So the object
              continues to move at the same velocity. So, when a vehicle travels at a steady speed
              the resistive forces balance the driving force. So, the velocity (speed and/or
              direction) of an object will only change if a resultant force is acting on the
              object. Students should be able to apply Newton’s First Law to explain the motion of
              objects moving with a uniform velocity and objects where the speed and/or direction
              changes. 4.5.6.2.2 Newton's Second Law Newton’s Second Law: The acceleration of an
              object is proportional to the resultant force acting on the object, and inversely
              proportional to the mass of the object. As an equation: resultant force = mass ×
              acceleration F = m a force, F, in newtons, N mass, m, in kilograms, kg acceleration,
              a, in metres per second squared, m/s² Students should be able to estimate the speed,
              accelerations and forces involved in large accelerations for everyday road
              transport. Students should recognise and be able to use the symbol that indicates an
              approximate value or approximate answer, ̴ Required practical activity 7:
              investigate the effect of varying the force on the acceleration of an object of
              constant mass, and the effect of varying the mass of an object on the acceleration
              produced by a constant force. 4.5.6.2.3 Newton's Third Law Newton’s Third Law:
              Whenever two objects interact, the forces they exert on each other are equal and
              opposite. Students should be able to apply Newton’s Third Law to examples of
              equilibrium situations.
            higher: >-
              Newton’s First Law: If the resultant force acting on an object is zero and: • the
              object is stationary, the object remains stationary • the object is moving, the
              object continues to move at the same speed and in the same direction. So the object
              continues to move at the same velocity. So, when a vehicle travels at a steady speed
              the resistive forces balance the driving force. So, the velocity (speed and/or
              direction) of an object will only change if a resultant force is acting on the
              object. Students should be able to apply Newton’s First Law to explain the motion of
              objects moving with a uniform velocity and objects where the speed and/or direction
              changes. (HT only) The tendency of objects to continue in their state of rest or of
              uniform motion is called inertia. 4.5.6.2.2 Newton's Second Law Newton’s Second Law:
              The acceleration of an object is proportional to the resultant force acting on the
              object, and inversely proportional to the mass of the object. As an equation:
              resultant force = mass × acceleration F = m a force, F, in newtons, N mass, m, in
              kilograms, kg acceleration, a, in metres per second squared, m/s² (HT only) Students
              should be able to explain that: • inertial mass is a measure of how difficult it is
              to change the velocity of an object • inertial mass is defined as the ratio of force
              over acceleration. Students should be able to estimate the speed, accelerations and
              forces involved in large accelerations for everyday road transport. Students should
              recognise and be able to use the symbol that indicates an approximate value or
              approximate answer, ̴ Required practical activity 7: investigate the effect of
              varying the force on the acceleration of an object of constant mass, and the effect
              of varying the mass of an object on the acceleration produced by a constant force.
              4.5.6.2.3 Newton's Third Law Newton’s Third Law: Whenever two objects interact, the
              forces they exert on each other are equal and opposite. Students should be able to
              apply Newton’s Third Law to examples of equilibrium situations.
          - ref: "4.5.6.3"
            foundation: >-
              The stopping distance of a vehicle is the sum of the distance the vehicle travels
              during the driver’s reaction time (thinking distance) and the distance it travels
              under the braking force (braking distance). For a given braking force the greater
              the speed of the vehicle, the greater the stopping distance. (Physics only) Students
              should be able to estimate how the distance for a vehicle to make an emergency stop
              varies over a range of speeds typical for that vehicle. (Physics only) Students will
              be required to interpret graphs relating speed to stopping distance for a range of
              vehicles. 4.5.6.3.2 Reaction time Reaction times vary from person to person. Typical
              values range from 0.2 s to 0.9 s. A driver’s reaction time can be affected by
              tiredness, drugs and alcohol. Distractions may also affect a driver’s ability to
              react. Students should be able to: • explain methods used to measure human reaction
              times and recall typical results • interpret and evaluate measurements from simple
              methods to measure the different reaction times of students • evaluate the effect of
              various factors on thinking distance based on given data. 4.5.6.3.3 Factors
              affecting braking distance 1 The braking distance of a vehicle can be affected by
              adverse road and weather conditions and poor condition of the vehicle. Adverse road
              conditions include wet or icy conditions. Poor condition of the vehicle is limited
              to the vehicle's brakes or tyres. Students should be able to: • explain the factors
              which affect the distance required for road transport vehicles to come to rest in
              emergencies, and the implications for safety • estimate how the distance required
              for road vehicles to stop in an emergency varies over a range of typical speeds.
              4.5.6.3.4 Factors affecting braking distance 2 When a force is applied to the brakes
              of a vehicle, work done by the friction force between the brakes and the wheel
              reduces the kinetic energy of the vehicle and the temperature of the brakes
              increases. The greater the speed of a vehicle the greater the braking force needed
              to stop the vehicle in a certain distance. The greater the braking force the greater
              the deceleration of the vehicle. Large decelerations may lead to brakes overheating
              and/or loss of control. Students should be able to: • explain the dangers caused by
              large decelerations
